            : '<span class="memo">아직 일정이 없어요. 눌러서 적어 보세요</span>'}</div>
          <div class="tc-meta"><span>🗺️ 일정 ${plans.length}개</span><span>💸 ${won(cost)}</span></div>
        </button>`;
    }
    document.getElementById('panel').innerHTML = `
      <button class="close" type="button" onclick="closePanel()">거실로 ←</button>
      <button class="btn back" type="button" onclick="backToTrips()">← 여행 목록</button>
      <h2>${esc(trip.name)} <span class="dday ${s.cls}">${s.text}</span></h2>
      <div class="sub">${shortDate(trip.start)} ~ ${shortDate(trip.end)} · ${nightsLabel(tripDays(trip))}
        <button class="link-btn" type="button" onclick="toggleTripEdit()">✏️ 제목 · 날짜 고치기</button>
        <button class="link-btn" type="button" onclick="removeTrip()">🗑️ 여행 지우기</button></div>
      ${travel.editTrip ? tripForm(trip) : ''}
      <div class="cost-sum"><span>💸 이 여행에 쓴 돈</span><b>${won(total)}</b></div>
      ${total ? `<div class="sec">${catBars(trip.costs)}</div>` : ''}
      <div class="sec"><h3>🗺️ 날짜별 일정 <span class="memo">날짜를 누르면 그날 일정 · 사용 비용을 적어요</span></h3>${days}</div>`;
  }

  // 날짜 안: 그날 일정 + 사용 비용
  function renderTripDay(trip, d) {
    const n = tripDays(trip);
    const plans = trip.plans.filter(p => p.day === d).sort(byTime);
    const costs = trip.costs.filter(c => c.day === d);
    const editPlan = travel.editKind === 'plan' ? trip.plans.find(p => p.id === travel.editId) : null;
    const editCost = travel.editKind === 'cost' ? trip.costs.find(c => c.id === travel.editId) : null;
    const cat = editCost ? editCost.cat : travel.costCat;

    const planList = plans.map(p => `
      <div class="ev">
        <div class="t">${p.time || '시간 미정'}</div>
        <div class="body"><div>${esc(p.title)}</div>${p.memo ? `<div class="memo">${esc(p.memo)}</div>` : ''}</div>
        <button class="icon-btn" type="button" title="고치기" onclick="startTripEdit('plan', '${p.id}', 'plTitle')">✏️</button>
        <button class="icon-btn" type="button" title="지우기" onclick="removePlan('${p.id}')">🗑️</button>
      </div>`).join('') || '<div class="empty small">아직 일정이 없어요. 아래에 적어 보세요 ✍️</div>';

    const costList = costs.map(c => `
      <div class="mrow">
        <span class="em">${tripCatEmoji(c.cat)}</span>
        <div class="body"><span>${esc(c.memo || c.cat)}</span>${c.memo ? `<span class="cat">${esc(c.cat)}</span>` : ''}</div>
        <span class="amt minus">${won(c.amount)}</span>
        <span class="acts">
          <button class="icon-btn" type="button" title="고치기" onclick="startTripEdit('cost', '${c.id}', 'cAmount')">✏️</button>
          <button class="icon-btn" type="button" title="지우기" onclick="removeCost('${c.id}')">🗑️</button>
        </span>
      </div>`).join('') || '<div class="empty small">이날 쓴 돈이 아직 없어요.</div>';

    document.getElementById('panel').innerHTML = `
      <button class="close" type="button" onclick="closePanel()">거실로 ←</button>
      <button class="btn back" type="button" onclick="backToTrip()">← ${esc(trip.name)}</button>
      <div class="cal-head">
        <button class="btn" type="button" onclick="openTripDay(${d - 1})" ${d === 0 ? 'disabled' : ''} aria-label="전날">◀</button>
        <div class="day-name"><b>${d + 1}일차 일정</b><span class="memo">${shortDate(tripDate(trip, d))}</span></div>
        <button class="btn" type="button" onclick="openTripDay(${d + 1})" ${d === n - 1 ? 'disabled' : ''} aria-label="다음 날">▶</button>
      </div>

      <div class="sec">
        <h3>🗺️ 일정</h3>
        ${planList}
        <form class="form plan-form" onsubmit="submitPlan(event)" autocomplete="off">
          <input type="time" name="plTime" value="${editPlan ? editPlan.time : ''}" aria-label="시간 (선택)">
          <input type="text" name="plTitle" maxlength="100" placeholder="어디서 뭐 할까요? (예: 성산일출봉 일출 보기)" value="${editPlan ? esc(editPlan.title) : ''}" required>
          <input class="full" type="text" name="plMemo" maxlength="300" placeholder="메모 (선택) · 주소, 예약 번호, 링크…" value="${editPlan ? esc(editPlan.memo) : ''}">
          <div class="actions">
            ${editPlan ? `<button class="btn" type="button" onclick="cancelTravelEdit()">취소</button>` : ''}
            <button class="btn primary" type="submit">${editPlan ? '고친 내용 저장' : '+ 일정 추가'}</button>
          </div>
        </form>
      </div>

      <div class="sec">
        <h3>💸 사용 비용 <span class="memo">이날 ${won(sumCost(costs))}</span></h3>
        <form class="form cost-form" onsubmit="submitCost(event)" autocomplete="off">
          <div class="full chips">${TRIP_CATS.map(([c, e]) => `
            <label class="pick"><input type="radio" name="cCat" value="${c}" ${c === cat ? 'checked' : ''} onchange="travel.costCat = this.value"><span>${e} ${c}</span></label>`).join('')}</div>
          <input class="amount" type="text" name="cAmount" inputmode="numeric" placeholder="금액 (원)" oninput="formatAmount(this)"
            value="${editCost ? editCost.amount.toLocaleString('ko-KR') : ''}" aria-label="금액" required>
          <input type="text" name="cMemo" maxlength="100" placeholder="메모 (선택) · 예: 흑돼지" value="${editCost ? esc(editCost.memo) : ''}">
          <div class="actions">
            ${editCost ? `<button class="btn" type="button" onclick="cancelTravelEdit()">취소</button>` : ''}
            <button class="btn primary" type="submit">${editCost ? '고친 내용 저장' : '+ 비용 적기'}</button>
          </div>
        </form>
        ${costs.length ? `<div class="sec">${catBars(costs)}</div>` : ''}
        ${costList}
      </div>`;
  }
  function startTripEdit(kind, id, field) {
    Object.assign(travel, { editKind: kind, editId: id });
    renderTravel();
    const input = document.querySelector(`input[name=${field}]`);
    input.scrollIntoView({ block: 'center' });
    input.focus();
  }
  function cancelTravelEdit() { Object.assign(travel, { editKind: '', editId: null }); renderTravel(); }

  function submitPlan(e) {
    e.preventDefault();
    const trip = currentTrip(), f = e.target.elements;
    if (!trip || travel.day === null) return;
    const title = f.plTitle.value.trim();
    if (!title) { toast('일정을 적어 주세요'); return; }
    const item = { time: TIME_RE.test(f.plTime.value) ? f.plTime.value : '', title, memo: f.plMemo.value.trim().slice(0, 300) };
    const p = travel.editKind === 'plan' && trip.plans.find(x => x.id === travel.editId);
    if (p) { Object.assign(p, item); if (saveDB()) toast('고친 내용을 저장했어요'); }
    else { trip.plans.push({ id: newId(), day: travel.day, ...item }); gainXP(XP.plan); if (saveDB()) toast(`${travel.day + 1}일차 일정을 적었어요 🗺️`); }
    Object.assign(travel, { editKind: '', editId: null });
    renderTravel();
    document.querySelector('.plan-form input[name=plTitle]').focus();
  }
  async function removePlan(id) {
    const trip = currentTrip(), p = trip && trip.plans.find(x => x.id === id);
    if (!p || !(await askConfirm(`'${p.title}' 일정을 지울까요?`, '지우기'))) return;
    trip.plans = trip.plans.filter(x => x.id !== id);
    gainXP(-XP.plan);
    if (travel.editId === id) Object.assign(travel, { editKind: '', editId: null });
    if (saveDB()) toast('일정을 지웠어요');
    renderTravel();
  }
  function submitCost(e) {
    e.preventDefault();
    const trip = currentTrip(), f = e.target.elements;
    if (!trip || travel.day === null) return;
    const amount = parseAmount(f.cAmount.value);
    if (!amount || amount > MAX_WON) { toast('금액을 숫자로 적어 주세요'); f.cAmount.focus(); return; }
    const cat = f.cCat.value || '기타';
    const item = { amount, cat, memo: f.cMemo.value.trim().slice(0, 100) };
    const c = travel.editKind === 'cost' && trip.costs.find(x => x.id === travel.editId);
    if (c) { Object.assign(c, item); if (saveDB()) toast('고친 내용을 저장했어요'); }
    else { trip.costs.push({ id: newId(), day: travel.day, ...item }); gainXP(XP.cost); if (saveDB()) toast(`${cat} ${won(amount)} 적었어요 💸`); }
    Object.assign(travel, { costCat: cat, editKind: '', editId: null });
    renderTravel();
    document.querySelector('.cost-form input[name=cAmount]').focus();
  }
  async function removeCost(id) {
    const trip = currentTrip(), c = trip && trip.costs.find(x => x.id === id);
    if (!c || !(await askConfirm(`${c.memo || c.cat} ${won(c.amount)}을 지울까요?`, '지우기'))) return;
    trip.costs = trip.costs.filter(x => x.id !== id);
    gainXP(-XP.cost);
    if (travel.editId === id) Object.assign(travel, { editKind: '', editId: null });
    if (saveDB()) toast('비용을 지웠어요');
    renderTravel();
  }
  // 거실 · 푸딩이 쓰는 다음 여행 (여행 중이면 그 여행)
  function nextTrip() {
    const today = ymd(new Date());
    return DB.trips.filter(t => t.end >= today).sort((a, b) => a.start.localeCompare(b.start))[0] || null;
  }

  // ---- 백업 (⚙️) ----
  const BACKUP_APP = 'my-home';
  // 가져오기 전 기록은 이 브라우저에 사람별로 잠깐 보관하고, 나가기 하면 지워요
  let BEFORE_IMPORT_KEY = STORE_KEY + ':before-import';
  const daysSince = date => Math.round((parseYmd(ymd(new Date())) - parseYmd(date)) / 86400000);
  function dataCounts(db) {
    return [
      ['🗓️ 일정', db.schedules.length], ['💼 할 일', db.tasks.length],
      ['📔 가계부 내역', db.money.length], ['✈️ 여행', db.trips.length],
    ];
  }
  const hasRecords = db => dataCounts(db).some(([, n]) => n > 0);

  function openBackup() { renderBackup(); document.getElementById('panelBg').classList.add('open'); }
  function renderBackup() {
    const last = DB.lastBackup;
    const lastText = !last ? '아직 백업한 적 없어요'
      : `${shortDate(last)} · ${daysSince(last) === 0 ? '오늘' : daysSince(last) + '일 전'}`;
    let before = null;
    try { before = localStorage.getItem(BEFORE_IMPORT_KEY); } catch (e) {}
    document.getElementById('panel').innerHTML = `
      <button class="close" type="button" onclick="closePanel()">거실로 ←</button>
      <h2>⚙️ 설정 · 백업</h2>
      <div class="sub">기록은 온라인 저장소(Supabase)에 저장돼요. 같은 동네 사람에게는 일정 '있음' · 여행 중 · 레벨 · 가구만 보여요. 그래도 가끔 파일로 내보내 두세요.</div>

      <div class="backup-box">
        <div class="bk-row"><span>👤 ${esc(MY_PROFILE ? MY_PROFILE.name : '')}</span><b class="memo">${esc(ME ? ME.email : '')}</b></div>
        <button class="btn bk-btn" type="button" onclick="logout()">🚪 나가기 (로그아웃)</button>
        <div class="memo">여러 사람이 같이 쓰는 컴퓨터라면 다 쓰고 꼭 나가기를 눌러 주세요.</div>
      </div>
      <div class="memo" style="margin-top:12px">💡 예전에 이 컴퓨터에서 쓰던 푸딩이네 기록은, 그 앱의 ⚙️에서 내보낸 백업 파일을 아래 '가져오기'로 옮기면 돼요.</div>

      <div class="backup-box">
        <div class="bk-row"><span>💾 마지막 백업</span><b class="${!last || daysSince(last) >= 7 ? 'minus' : ''}">${lastText}</b></div>
        <div class="bk-counts">${dataCounts(DB).map(([k, n]) => `<span>${k} <b>${n}</b></span>`).join('')}</div>
      </div>

      <div class="sec">
        <h3>📤 백업 파일로 내보내기</h3>
        <div class="memo">모든 기록을 파일 하나로 저장해요. 파일은 보통 '다운로드' 폴더에 들어가요. 구글 드라이브 같은 곳에 복사해 두면 더 안전해요.</div>
        <button class="btn primary bk-btn" type="button" onclick="exportBackup()">📤 지금 내보내기</button>
      </div>

      <div class="sec">
        <h3>📥 백업 파일 가져오기</h3>
        <div class="memo">내보냈던 파일을 고르면 무엇이 들어 있는지 먼저 보여 줘요. 확인을 눌러야 바뀌어요.</div>
        <input type="file" id="backupFile" accept=".json,application/json" hidden onchange="importBackup(this)">
        <button class="btn bk-btn" type="button" onclick="document.getElementById('backupFile').click()">📥 파일 고르기</button>
      </div>

      ${before ? `
      <div class="sec">
        <h3>↩️ 가져오기 전으로 되돌리기</h3>
        <div class="memo">마지막으로 백업을 가져오기 직전의 기록을 보관해 두었어요.</div>
        <button class="btn bk-btn" type="button" onclick="undoImport()">↩️ 가져오기 전 기록으로 되돌리기</button>
      </div>` : ''}`;
  }

  function exportBackup() {
    const today = ymd(new Date());
    DB.lastBackup = today;
    const file = JSON.stringify({ app: BACKUP_APP, version: 1, exportedAt: new Date().toISOString(), data: DB }, null, 2);
    const url = URL.createObjectURL(new Blob([file], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = `나만의집-백업-${today}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    if (saveDB()) toast('백업 파일을 저장했어요 💾 다운로드 폴더를 확인해 보세요');
    renderBackup();
    refreshLiving();
  }

  // 가져오기: 파일 읽기 → 형식 검사 → 무엇이 들었는지 보여 주기 → 확인하면 바꾸기
  async function importBackup(input) {
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { toast('파일이 너무 커요. 이 앱의 백업 파일이 맞는지 확인해 주세요'); return; }
    let parsed;
    try { parsed = JSON.parse(await file.text()); }
    catch (e) { toast('파일을 읽을 수 없어요. 이 앱에서 내보낸 백업 파일을 골라 주세요'); return; }
    const raw = parsed && parsed.app === BACKUP_APP && parsed.data ? parsed.data : null;
    if (!raw || typeof raw !== 'object') { toast('나만의 집 백업 파일이 아니에요'); return; }

    const next = normalize(raw);
    if (!hasRecords(next)) { toast('이 백업 파일에는 기록이 없어요'); return; }
    const when = typeof parsed.exportedAt === 'string' && DATE_RE.test(parsed.exportedAt.slice(0, 10)) ? shortDate(parsed.exportedAt.slice(0, 10)) : '날짜 모름';
    const summary = dataCounts(next).map(([k, n]) => `${k} ${n}개`).join('\n');
    const ok = await askConfirm(`${when}에 만든 백업이에요.\n\n${summary}\n\n지금 기록을 이 백업으로 바꿀까요?\n(지금 기록은 따로 보관해 둬서 되돌릴 수 있어요)`, '바꾸기');
    if (!ok) return;

    try { localStorage.setItem(BEFORE_IMPORT_KEY, JSON.stringify(DB)); }
    catch (e) { toast('지금 기록을 보관하지 못해서 가져오기를 멈췄어요'); return; }
    DB = next;
    if (saveDB()) toast('백업을 가져왔어요 📥');
    renderBackup();
    refreshLiving();
  }
  async function undoImport() {
    let raw = null;
    try { raw = localStorage.getItem(BEFORE_IMPORT_KEY); } catch (e) {}
    if (!raw) return;
    let prev;
    try { prev = normalize(JSON.parse(raw)); } catch (e) { toast('보관한 기록을 읽을 수 없어요'); return; }
    if (!(await askConfirm(`가져오기 전 기록으로 되돌릴까요?\n\n${dataCounts(prev).map(([k, n]) => `${k} ${n}개`).join('\n')}`, '되돌리기'))) return;
    DB = prev;
    try { localStorage.removeItem(BEFORE_IMPORT_KEY); } catch (e) {}
    if (saveDB()) toast('가져오기 전 기록으로 되돌렸어요 ↩️');
    renderBackup();
    refreshLiving();
  }

  // ---- 🛋️ 가구 상점 ----
  const haveXP = () => DB.xp.total - DB.xp.spent;
  const shop = { tab: 'all' };
  function openShop() { renderShop(); document.getElementById('panelBg').classList.add('open'); }
  function setShopTab(t) { shop.tab = t; renderShop(); }
  // 같은 slot(예: 머리)의 다른 가구는 치우고 이걸 놓아요
  function placeItem(id) {
    const it = FURNITURE.find(x => x.id === id);
    const f = DB.furniture;
    if (it.slot) f.placed = f.placed.filter(p => (FURNITURE.find(x => x.id === p) || {}).slot !== it.slot);
    if (!f.placed.includes(id)) f.placed.push(id);
  }
  function renderShop() {
    const { lv } = levelInfo(DB.xp.total);
    const list = FURNITURE.filter(it => shop.tab === 'all' || it.place === shop.tab);
    const tabs = SHOP_TABS.map(([v, label]) => {
      const n = FURNITURE.filter(it => (v === 'all' || it.place === v) && DB.furniture.owned.includes(it.id)).length;
      const total = FURNITURE.filter(it => v === 'all' || it.place === v).length;
      return `<button class="tab ${shop.tab === v ? 'on' : ''}" type="button" onclick="setShopTab('${v}')">${label} <span class="memo">${n}/${total}</span></button>`;
    }).join('');
    const cards = list.map(it => {
      const owned = DB.furniture.owned.includes(it.id), placed = DB.furniture.placed.includes(it.id);
      let action;
      if (owned) {
        action = `<button class="btn ${placed ? '' : 'primary'}" type="button" onclick="togglePlace('${it.id}')">${placed ? '치우기' : '거실에 놓기'}</button>`;
      } else if (lv < it.lv) {
        action = `<button class="btn" type="button" disabled>🔒 Lv.${it.lv}부터</button>`;
      } else if (haveXP() < it.price) {
        action = `<button class="btn" type="button" disabled>XP ${it.price - haveXP()} 더 필요</button>`;
      } else {
        action = `<button class="btn primary" type="button" onclick="buyFurniture('${it.id}')">${it.price} XP로 사기</button>`;
      }
      return `
        <div class="shop-card ${owned ? 'owned' : ''} ${!owned && lv < it.lv ? 'locked' : ''}">
          <div class="sc-emoji">${it.emoji}</div>
          <b>${it.name}</b>
          <div class="memo">${it.desc}${it.slot ? ' · 머리에는 하나만 써요' : ''}</div>
          <div class="sc-price">${owned ? (placed ? '✔ 거실에 있어요' : '갖고 있어요') : `⭐ ${it.price} XP · Lv.${it.lv}`}</div>
          ${action}
        </div>`;
    }).join('');
    document.getElementById('panel').innerHTML = `
      <button class="close" type="button" onclick="closePanel()">거실로 ←</button>
      <h2>🛋️ 가구 상점</h2>
      <div class="sub">기록해서 모은 XP로 가구를 사서 거실을 꾸며요. 산 가구는 언제든 치웠다가 다시 놓을 수 있어요.</div>
      <div class="cost-sum"><span>⭐ 가진 XP <span class="memo">Lv.${lv}</span></span><b class="xp-have">${haveXP()} XP</b></div>
      <div class="tabs" style="margin-top:12px">${tabs}</div>
      <div class="shop-grid">${cards}</div>`;
  }
  async function buyFurniture(id) {
    const it = FURNITURE.find(x => x.id === id);
    if (!it || DB.furniture.owned.includes(id) || haveXP() < it.price || levelInfo(DB.xp.total).lv < it.lv) return;
    if (!(await askConfirm(`${it.emoji} ${it.name}을(를) ${it.price} XP로 살까요?\n사면 바로 거실에 놓아요.`, '사기'))) return;
    DB.xp.spent += it.price;
    DB.furniture.owned.push(id);
    placeItem(id);
    if (saveDB()) toast(`${it.emoji} ${it.name}을(를) 거실에 놓았어요!`);
    document.getElementById('bubbleText').textContent = `와 ${it.name}! 고마워 🍮`.slice(0, 19);
    renderShop();
    refreshLiving();
  }
  function togglePlace(id) {
    const f = DB.furniture;
    if (!f.owned.includes(id)) return;
    if (f.placed.includes(id)) f.placed = f.placed.filter(x => x !== id);
    else placeItem(id);
    saveDB();
    renderShop();
    refreshLiving();
  }
  // 거실 그림에 놓은 가구만 보여 줘요
  function applyFurniture() {
    const placed = DB.furniture.placed;
    FURNITURE.forEach(it => {
      const el = document.getElementById('f-' + it.id);
      if (el) el.style.display = placed.includes(it.id) ? '' : 'none';

    document.getElementById('scarf2').setAttribute('fill', red ? '#C93C47' : '#6AB8A4');

    [['rug1', '#F7B3C2', '#C9B8E8'], ['rug2', '#FFF0E4', '#A6D8F0'], ['rug3', '#FBCDB6', '#FFE68A']]

  // ---- XP 받는 법 (레벨 바를 누르면) ----
  function openXP() {

    const rules = [

  // ---- 오늘판: 오늘 일정 · 오늘까지 할 업무 · 내일 미리 보기를 한 화면에 ----
  function renderTodayBoard() {
    const today = ymd(new Date());
    const tmr = new Date(); tmr.setDate(tmr.getDate() + 1);
    const tomorrow = ymd(tmr);
    const MAX = 5;
    const schedRow = s => `<div class="row" onclick="openPanel('schedule')"><span class="tag">${s.time || '하루'}</span><span class="t">${esc(s.title)}</span></div>`;
    const taskRow = t => {
      const d = dueInfo(t.due);
      return `<div class="row" onclick="openPanel('work')"><span class="t">${t.urgent ? '🔥 ' : ''}${esc(t.title)}</span><span class="tag ${d.cls}">${d.text}</span></div>`;
    };
    const col = (title, rows, emptyText) => `
      <div class="col">
        <h4><span>${title}</span><span class="n">${rows.length}</span></h4>
        ${rows.slice(0, MAX).join('') || `<div class="none">${emptyText}</div>`}
        ${rows.length > MAX ? `<div class="more">+${rows.length - MAX}개 더</div>` : ''}
      </div>`;
    const todo = DB.tasks.filter(t => !t.done && t.due);
    const dueNow = todo.filter(t => t.due <= today).sort(byDue).map(taskRow);
    const next = schedulesOn(tomorrow).map(schedRow).concat(todo.filter(t => t.due === tomorrow).sort(byDue).map(taskRow));
    const workCol = VISIT
      ? `<div class="col locked"><h4><span>💼 업무</span><span class="n">🔒</span></h4><div class="none">🔒 ${esc(VISIT.name)}님만 볼 수 있어요</div></div>`
      : col('💼 오늘까지 할 업무', dueNow, '급한 마감이 없어요 🎉');
    document.getElementById('todayBoard').innerHTML =
      col('🗓️ 오늘 일정', schedulesOn(today).map(schedRow), '오늘은 일정이 없어요')
      + workCol
      + col('🌙 내일 미리 보기', next, '내일은 아직 비어 있어요');
  }

  // ---- 거실에 오늘 기록 보여 주기 ----
  function refreshLiving() {
    refreshHUD();
    applyFurniture();
    const n = schedulesOn(ymd(new Date())).length;
    document.getElementById('todaySched').textContent = n + '개';
    document.getElementById('calBadge').style.display = n ? '' : 'none';
    document.getElementById('calBadgeN').textContent = n;

    const todo = DB.tasks.filter(t => !t.done);
    const next = todo.filter(t => t.due).sort(byDue)[0];
    document.getElementById('todayWork').textContent = todo.length + '개' + (next ? ' · ' + dueInfo(next.due).text : '');

    document.getElementById('workBadge').style.display = hot ? '' : 'none';
    document.getElementById('workBadgeN').textContent = hot;

    document.getElementById('todayMoney').textContent = !allowance ? won(outSum) : remain < 0 ? won(-remain) + ' 넘음' : won(remain);

    const trip = nextTrip();

      : ymd(new Date()) >= trip.start ? `${short(trip.name)} 여행 중` : `${short(trip.name)} ${ddayLabel(trip.start)}`;

  }

  // ---- 아직 기능을 붙이지 않은 공간 (가짜 데이터) ----
  function openPanel(key) {
    document.getElementById('panel').classList.add('square');
    if (VISIT) {
      if (key === 'schedule') { openVisitSchedule(); return; }
      toast(`🔒 ${VISIT.name}님만 볼 수 있어요`);
      return;
    }
    if (key === 'schedule') { openSchedule(); return; }
    if (key === 'work') { openWork(); return; }
    if (key === 'money') { openMoney(); return; }
    if (key === 'travel') { openTravel(); return; }
    if (key === 'settings') { openBackup(); return; }
    if (key === 'xp') { openXP(); return; }
    if (key === 'shop') { openShop(); return; }
  }
  function closePanel() { document.getElementById('panelBg').classList.remove('open'); }

  // 창 아래에 내용이 더 있으면 "▼ 아래에 더 있어요"를 보여 줘요
  function updateMoreHint() {
    const bg = document.getElementById('panelBg'), p = document.getElementById('panel'), hint = document.getElementById('moreHint');
    const isOpen = bg.classList.contains('open');
    document.body.classList.toggle('modal-open', isOpen);
    const more = isOpen && p.scrollHeight - p.scrollTop - p.clientHeight > 24;
    hint.style.display = more ? 'block' : 'none';
    if (!more) return;
    const r = p.getBoundingClientRect();
    hint.style.left = (r.left + r.width / 2) + 'px';
    hint.style.top = (r.bottom - 46) + 'px';
  }
  document.getElementById('moreHint').onclick = () => {
    const p = document.getElementById('panel');
    p.scrollBy({ top: p.clientHeight * 0.7, behavior: 'smooth' });
  };
  document.getElementById('panel').addEventListener('scroll', updateMoreHint);
  window.addEventListener('resize', updateMoreHint);
  // 창이 열리고 닫힐 때, 창 안 내용이 바뀔 때 다시 계산해요 (안내 버튼 자체의 변화는 보지 않아요)
  const hintObserver = new MutationObserver(() => requestAnimationFrame(updateMoreHint));
  hintObserver.observe(document.getElementById('panelBg'), { attributes: true, attributeFilter: ['class'] });
  hintObserver.observe(document.getElementById('panel'), { childList: true, subtree: true });
  document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (dlgDone) dlgDone(null); else closePanel(); });

  // ---- 푸딩 말풍선 ----
  const LINES = ['어서 와! 오늘은 뭘 적어 볼까?', '달력을 누르면 일정을 볼 수 있어', '다이어리에 오늘 쓴 돈 적었어?', '기록하면 XP가 쌓여! 🍮', '문 너머에 여행 준비가 있어 ✈️'];
  // 오늘 기록에 맞춘 대사 (급한 것부터)
  function todayLines() {
    const lines = [];
    const hot = urgentTasks().length;
    if (hot) lines.push(`오늘까지 할 업무가 ${hot}개 있어!`);
    const items = schedulesOn(ymd(new Date()));
    if (items.length === 1) lines.push(`오늘은 '${items[0].title}' 있는 날!`);
    else if (items.length > 1) lines.push(`오늘 일정 ${items.length}개! 달력 눌러 봐`);
    const trip = nextTrip();
    if (trip && ymd(new Date()) >= trip.start) lines.push('여행 즐겁게 다녀와! ✈️');
    else if (trip && (parseYmd(trip.start) - parseYmd(ymd(new Date()))) / 86400000 <= 7) {
      const left = DB.packList.filter(p => !p.done).length;
      lines.push(left ? `여행 ${ddayLabel(trip.start)}! 준비물 ${left}개 남았어` : `여행 ${ddayLabel(trip.start)}! 두근두근 🧳`);
    }
    if (hasRecords(DB) && (!DB.lastBackup || daysSince(DB.lastBackup) >= 7)) {
      lines.push(DB.lastBackup ? '백업한 지 일주일 넘었어 💾' : '⚙️ 눌러서 백업해 두자 💾');
    }
    const { allowance, outSum } = monthTotals(ymd(new Date()).slice(0, 7));
    if (allowance && outSum >= allowance) lines.push('이번 달 용돈을 다 썼어 😢');
    else if (allowance && outSum >= allowance * 0.8) lines.push('용돈이 20%도 안 남았어!');
    return lines;
  }
  const todayLine = () => todayLines()[0] || null;
  function sayRandom() {
    const t = document.getElementById('bubbleText');
    const { cur, need } = levelInfo(DB.xp.total);
    const pool = VISIT ? VISIT_LINES() : LINES.concat(todayLines(), `다음 레벨까지 ${need - cur} XP!`);
    let next; do { next = pool[Math.floor(Math.random() * pool.length)]; } while (next === t.textContent);
    t.textContent = next.length > 19 ? next.slice(0, 18) + '…' : next;
  }

  // ---- 시간 · 계절 (주소 뒤에 ?time=night&season=winter 를 붙이면 미리보기) ----
  const q = new URLSearchParams(location.search);
  // 새벽 5~7시 · 낮 7~17시 · 저녁 17~19시 · 밤 19~5시
  function timeOfDay(h) { return h >= 5 && h < 7 ? 'dawn' : h >= 7 && h < 17 ? 'day' : h >= 17 && h < 19 ? 'evening' : 'night'; }
  const PART = { dawn: '새벽', day: '낮', evening: '저녁', night: '밤' };
  const PREVIEW_HOUR = { dawn: 6, day: 12, evening: 18, night: 22 };
  function seasonOf(m) { return m >= 3 && m <= 5 ? 'spring' : m >= 6 && m <= 8 ? 'summer' : m >= 9 && m <= 11 ? 'autumn' : 'winter'; }

  const SKY = { dawn: ['#B9A6E0', '#FFD1C2'], day: ['#9ED8F5', '#DFF3FB'], evening: ['#F59E7A', '#FBD9A0'], night: ['#1E2B52', '#3B4C80'] };
  const TREE = { spring: '#F7B8C8', summer: '#4FAE55', autumn: '#E8913C', winter: '#E9F1F5' };
  const HILL = { spring: '#9AD38A', summer: '#6DBE6A', autumn: '#C9A45A', winter: '#F4F8FA' };
  function paint() {
    const now = new Date();
    const tod = q.get('time') || timeOfDay(now.getHours());
    const season = q.get('season') || seasonOf(now.getMonth() + 1);
    const $ = id => document.getElementById(id);

    $('skyTop').setAttribute('stop-color', SKY[tod][0]);
    $('skyBottom').setAttribute('stop-color', SKY[tod][1]);
    // 해는 5시에 왼쪽 아래에서 떠서 19시에 오른쪽 아래로 져요
    const hour = q.get('time') ? PREVIEW_HOUR[tod] : now.getHours() + now.getMinutes() / 60;
    const p = Math.min(1, Math.max(0, (hour - 5) / 14));
    $('sun').style.display = tod === 'night' ? 'none' : '';
    $('sun').setAttribute('cx', 72 + p * 156);
    $('sun').setAttribute('cy', 175 - Math.sin(p * Math.PI) * 95);
    $('sun').setAttribute('fill', tod === 'day' ? '#FFD95A' : '#FF9A5A');
    $('clouds').style.display = tod === 'night' ? 'none' : '';
    $('clouds').setAttribute('fill', tod === 'day' ? '#FFFFFF' : '#FFE1D6');
    $('moon').style.display = tod === 'night' ? '' : 'none';
    $('moonCut').setAttribute('fill', SKY.night[0]);
    $('stars').style.display = tod === 'night' ? '' : 'none';
    $('nightShade').setAttribute('opacity', tod === 'night' ? .22 : tod === 'day' ? 0 : .08);
    $('glow').style.display = tod === 'day' ? 'none' : '';

    $('treeTop').setAttribute('fill', TREE[season]);
    $('hill').setAttribute('fill', HILL[season]);
    $('petals').style.display = season === 'spring' ? '' : 'none';
    $('snow').style.display = season === 'winter' ? '' : 'none';
    $('lights').style.display = (q.get('xmas') === '1' || now.getMonth() === 11) ? '' : 'none';

    $('calMonth').textContent = (now.getMonth() + 1) + '월';
    $('calDay').textContent = now.getDate();
    $('calWeek').textContent = WEEK[now.getDay()] + '요일';

    $('clockTime').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
    $('clockPart').textContent = PART[timeOfDay(now.getHours())];
  }
  // ---- 동네: 문패에 올리는 공개 정보 ----
  // 같은 동네 사람에게는 이것만 보여요: 레벨 · 놓은 가구 · 앞으로 60일 일정의 날짜와 시간(제목 없음) · 여행 중인지
  function publicData(db) {
    const today = ymd(new Date());
    const until = new Date(); until.setDate(until.getDate() + 60);
    const end = ymd(until);
    const busy = db.schedules.filter(s => s.date >= today && s.date <= end)
      .sort((a, b) => a.date.localeCompare(b.date) || byTime(a, b)).slice(0, 200)
      .map(s => ({ d: s.date, t: s.time }));
    const trip = db.trips.filter(t => t.end >= today).sort((a, b) => a.start.localeCompare(b.start))[0];
    let tr = null;
    if (trip && trip.start <= today) tr = { s: 'now' };
    else if (trip) {
      const n = Math.round((parseYmd(trip.start) - parseYmd(today)) / 86400000);
      if (n <= 60) tr = { s: 'soon', d: n };
    }
    return { lv: levelInfo(db.xp.total).lv, furn: db.furniture.placed.slice(0, 40), busy, trip: tr };
  }
  // 문패는 다른 사람이 쓴 것이라 하나씩 검사해서 써요
  function readPublic(p) {
    const pd = p && p.public_data && typeof p.public_data === 'object' ? p.public_data : {};
    const today = ymd(new Date());
    const lv = Number.isInteger(pd.lv) && pd.lv > 0 && pd.lv < 1000 ? pd.lv : 1;
    const busy = Array.isArray(pd.busy) ? pd.busy.filter(b => b && typeof b.d === 'string' && DATE_RE.test(b.d) && b.d >= today
      && typeof b.t === 'string' && (b.t === '' || TIME_RE.test(b.t))).slice(0, 200) : [];
    const furn = Array.isArray(pd.furn) ? pd.furn.filter(id => FURNITURE.some(it => it.id === id)) : [];
    const tr = pd.trip && (pd.trip.s === 'now' || (pd.trip.s === 'soon' && Number.isInteger(pd.trip.d) && pd.trip.d >= 0 && pd.trip.d <= 60)) ? pd.trip : null;
    return { lv, busy, furn, trip: tr };
  }
  const tripText = tr => !tr ? '' : tr.s === 'now' ? '✈️ 여행 중' : tr.d === 0 ? '✈️ 오늘 여행 출발' : `✈️ D-${tr.d} 여행 예정`;
  function xpForLevel(lv) { let t = 0; for (let i = 1; i < lv; i++) t += 50 + (i - 1) * 25; return t; }

  // 놀러 간 집: 문패 정보만으로 거실을 꾸며요 (일정은 '일정 있음'으로만)
  function visitDB(p) {
    const pub = readPublic(p);
    return normalize({
      schedules: pub.busy.map((b, i) => ({ id: 'b' + i, date: b.d, time: b.t, title: '일정 있음', memo: '' })),
      xp: { total: xpForLevel(pub.lv), spent: 0 },
      furniture: { owned: pub.furn, placed: pub.furn },
    });
  }
  function applyVisitView() {
    const $ = id => document.getElementById(id);
    $('todayWork').textContent = '🔒 잠김';
    $('workBadge').style.display = 'none';
    $('moneyLabel').textContent = '📔 가계부';
    $('todayMoney').textContent = '🔒 잠김';
    $('todayTravel').textContent = tripText(readPublic(VISIT).trip).replace('✈️ ', '') || '계획 없음';
  }
  const VISIT_LINES = () => [`${homeOf(VISIT.name)}에 온 걸 환영해!`, '천천히 구경하고 가 🍮', '업무랑 가계부는 비밀이야 🤫', '달력엔 일정 있음만 보여!'];
  function openVisitSchedule() {
    const groups = {};
    DB.schedules.forEach(s => { (groups[s.date] = groups[s.date] || []).push(s); });
    const days = Object.keys(groups).sort().slice(0, 30);
    document.getElementById('panel').innerHTML = `
      <button class="close" type="button" onclick="closePanel()">거실로 ←</button>
      <h2>🗓️ ${esc(VISIT.name)}님의 일정</h2>
      <div class="sub">언제 일정이 있는지만 보여요. 무슨 일정인지는 ${esc(VISIT.name)}님만 알아요.</div>
      ${days.map(d => `
        <div class="day-head"><span>${dateLabel(d)}</span><span>${groups[d].length}개</span></div>
        ${groups[d].sort(byTime).map(s => `<div class="mrow"><span class="em">🔒</span><div class="body">${s.time || '하루 종일'} · 일정 있음</div></div>`).join('')}`).join('')
        || `<div class="empty">앞으로 60일 동안 일정이 없어요.</div>`}`;
    document.getElementById('panelBg').classList.add('open');
  }

  // ---- 로그인 · 로비 화면 ----
  const gate = document.getElementById('gate');
  let LOBBY = [], HOOD_NAME = '', authTab = 'login';
  function showGate(html) { closePanel(); gate.innerHTML = html; gate.classList.add('open'); gate.scrollTop = 0; }
  function hideGate() { gate.classList.remove('open'); }
  const gateErr = msg => { const el = document.getElementById('gateErr'); if (el) el.textContent = msg; };
  const busyBtn = (on) => gate.querySelectorAll('button').forEach(b => { b.disabled = on; });

  // Supabase 오류를 쉬운 말로
  function friendly(e) {
    const m = String((e && (e.message || e.code)) || e || '');
    if (/invalid login credentials/i.test(m)) return '이메일이나 비밀번호가 맞지 않아요';
    if (/already registered|already exists/i.test(m)) return '이미 가입한 이메일이에요. 들어가기 탭에서 들어와 주세요';
    if (/bad_code/.test(m)) return '동네 코드가 맞지 않아요';
    if (/email.*invalid|invalid.*email/i.test(m)) return '이메일 모양이 맞지 않아요';
    if (/password/i.test(m) && /least|short|weak/i.test(m)) return '비밀번호는 8자 이상으로 정해 주세요';
    if (/not confirmed/i.test(m)) return "Supabase에서 'Confirm email'을 꺼 주세요";
    if (/fetch|network/i.test(m)) return '인터넷 연결을 확인해 주세요';
    if (/rate limit/i.test(m)) return '너무 여러 번 시도했어요. 잠시 뒤에 다시 해 주세요';
    return '문제가 생겼어요: ' + m.slice(0, 80);
  }

  function showConfigGate() {
    showGate(`<div class="gate-box"><h1>🍮 푸딩이네 동네</h1>
      <div class="sub">아직 저장소가 연결되지 않았어요.</div>
      <div class="memo">my-home 폴더의 <b>config.js</b>에 Supabase 주소와 공개용 키를 넣어 주세요. (배포한 링크라면 넣고 다시 배포해요)</div></div>`);
  }
  function showAuth(tab) {
    authTab = tab || authTab;
    const signup = authTab === 'signup';
    showGate(`<div class="gate-box">
      <h1>🍮 푸딩이네 동네</h1>
      <div class="sub">${signup ? '동네 코드를 받은 사람만 이사 올 수 있어요' : '내 집으로 들어가요'}</div>
      <div class="tabs">
        <button class="tab ${signup ? '' : 'on'}" type="button" onclick="showAuth('login')">들어가기</button>
        <button class="tab ${signup ? 'on' : ''}" type="button" onclick="showAuth('signup')">이사 오기 (가입)</button>
      </div>
      <form onsubmit="${signup ? 'doSignup' : 'doLogin'}(event)" autocomplete="on">
        <label>이메일<input type="email" name="email" required maxlength="100" autocomplete="email" autocapitalize="none" autocorrect="off"></label>
        <label>비밀번호 <span class="memo">8자 이상</span><input type="password" name="pw" required minlength="8" maxlength="72" autocomplete="${signup ? 'new-password' : 'current-password'}"></label>
        ${signup ? `
        <label>비밀번호 한 번 더<input type="password" name="pw2" required minlength="8" maxlength="72" autocomplete="new-password"></label>
        <label>집 이름 <span class="memo">로비에 'OO네 집'으로 보여요 · 12자까지</span><input type="text" name="name" required maxlength="12"></label>
        <label>동네 코드 <span class="memo">동네 주인에게 받은 코드</span><input type="text" name="code" required maxlength="40" autocapitalize="none" autocorrect="off"></label>
        <div class="memo">비밀번호 찾기가 없어요. 다른 사이트와 다른 비밀번호로 정하고, 따로 적어 두세요.</div>` : ''}
        <div class="err" id="gateErr"></div>
        <button class="btn primary" type="submit">${signup ? '🏠 이사 오기' : '🚪 들어가기'}</button>
      </form></div>`);
  }
  async function doLogin(e) {
    e.preventDefault();
    const f = e.target.elements;
    busyBtn(true); gateErr('');
    const { data, error } = await SB.auth.signInWithPassword({ email: f.email.value.trim(), password: f.pw.value });
    busyBtn(false);
    if (error) { gateErr(friendly(error)); return; }
    afterLogin(data.session);
  }
  async function doSignup(e) {
    e.preventDefault();
    const f = e.target.elements;
    const email = f.email.value.trim(), pw = f.pw.value, name = f.name.value.trim(), code = f.code.value.trim();
    if (pw.length < 8) { gateErr('비밀번호는 8자 이상으로 정해 주세요'); return; }
    if (pw !== f.pw2.value) { gateErr('비밀번호 두 칸이 서로 달라요'); return; }
    if (!name) { gateErr('집 이름을 적어 주세요'); return; }
    busyBtn(true); gateErr('');
    try {
      // 계정을 만들기 전에 동네 코드부터 확인해요
      const chk = await SB.rpc('hood_name', { p_code: code });
      if (chk.error) throw chk.error;
      if (!chk.data) throw new Error('bad_code');
      const { data, error } = await SB.auth.signUp({ email, password: pw });
      if (error) throw error;
      if (!data.session) throw new Error('not confirmed');
      const j = await SB.rpc('join_hood', { p_code: code, p_name: name });
      if (j.error) throw j.error;
      toast(`${j.data}에 이사 왔어요 🏠`);
      afterLogin(data.session);
    } catch (err) { busyBtn(false); gateErr(friendly(err)); }
  }
  // 가입은 됐는데 동네에 못 들어간 경우 (코드를 다시 넣어요)
  function showJoin() {
    showGate(`<div class="gate-box"><h1>🏘️ 동네 코드</h1>
      <div class="sub">${esc(ME.email)} 계정으로 들어왔어요. 동네 코드를 넣으면 집이 생겨요.</div>
      <form onsubmit="doJoin(event)">
        <label>집 이름 <span class="memo">12자까지</span><input type="text" name="name" required maxlength="12"></label>
        <label>동네 코드<input type="text" name="code" required maxlength="40" autocapitalize="none" autocorrect="off"></label>
        <div class="err" id="gateErr"></div>
        <button class="btn primary" type="submit">🏠 집 만들기</button>
        <button class="btn" type="button" onclick="logout()">다른 계정으로</button>
      </form></div>`);
  }
  async function doJoin(e) {
    e.preventDefault();
    const f = e.target.elements;
    busyBtn(true); gateErr('');
    const j = await SB.rpc('join_hood', { p_code: f.code.value.trim(), p_name: f.name.value.trim() });
    busyBtn(false);
    if (j.error) { gateErr(friendly(j.error)); return; }
    const { data } = await SB.auth.getSession();
    afterLogin(data.session);
  }

  async function afterLogin(session) {
    if (!session) { showAuth('login'); return; }
    ME = session.user;
    BEFORE_IMPORT_KEY = STORE_KEY + ':before-import:' + ME.id;
    showGate(`<div class="gate-box"><h1>🍮 푸딩이네 동네</h1><div class="sub">집 문을 여는 중…</div></div>`);
    const prof = await SB.from('profiles').select('user_id, name, public_data, updated_at').eq('user_id', ME.id).maybeSingle();
    if (prof.error) { showGate(`<div class="gate-box"><h1>😢</h1><div class="err">${esc(friendly(prof.error))}</div><button class="btn" onclick="location.reload()">다시 해 보기</button></div>`); return; }
    if (!prof.data) { showJoin(); return; }
    MY_PROFILE = prof.data;
    const home = await SB.from('homes').select('data').eq('user_id', ME.id).maybeSingle();
    if (home.error) { showGate(`<div class="gate-box"><h1>😢</h1><div class="err">${esc(friendly(home.error))}</div><button class="btn" onclick="location.reload()">다시 해 보기</button></div>`); return; }
    HOME = DB = normalize(home.data ? home.data.data : {});
    VISIT = null;
    const hn = await SB.rpc('my_hood_name');
    HOOD_NAME = hn.data || '우리 동네';
    if (!home.data) { saveDB(); await flushSave(); } // 처음 들어온 사람은 빈 집을 만들어 둬요
    showLobby();
  }

  async function goLobby() { await flushSave(); showLobby(); }
  async function showLobby() {
    showGate(`<div class="gate-box wide"><h1>🏘️ ${esc(HOOD_NAME)}</h1><div class="sub">집들을 불러오는 중…</div></div>`);
    const { data, error } = await SB.from('profiles').select('user_id, name, public_data, updated_at').order('updated_at', { ascending: false }).limit(100);
    if (error) { toast(friendly(error)); }
    LOBBY = (data || []).sort((a, b) => (b.user_id === ME.id) - (a.user_id === ME.id));
    const today = ymd(new Date());
    const cards = LOBBY.map(p => {
      const mine = p.user_id === ME.id;
      const pub = mine ? readPublic({ public_data: publicData(HOME) }) : readPublic(p);
      const n = pub.busy.filter(b => b.d === today).length;
      const status = [n ? `🗓️ 오늘 일정 ${n}개 있음` : '🗓️ 오늘은 한가해요', tripText(pub.trip)].filter(Boolean).join('<br>');
      return `
        <div class="house ${mine ? 'mine' : ''}">
          <div class="roof">${mine ? '🏡' : '🏠'}</div>
          <b>${esc(homeOf(p.name))} ${mine ? '<span class="memo">(내 집)</span>' : ''}</b>
          <div class="st">Lv.${pub.lv} · 가구 ${pub.furn.length}개</div>
          <div class="st">${status}</div>
          <button class="btn ${mine ? 'primary' : ''}" type="button" onclick="visitHouse('${p.user_id}')">${mine ? '🚪 내 집 들어가기' : '👋 놀러 가기'}</button>
        </div>`;
    }).join('');
    showGate(`<div class="gate-box wide">
      <div class="gate-top">
        <div><h1>🏘️ ${esc(HOOD_NAME)}</h1><div class="sub" style="margin:0">${esc(MY_PROFILE.name)}님, 어서 와요! 이웃집에서는 일정 '있음' · 여행 중만 보이고 업무 · 가계부는 잠겨 있어요.</div></div>
        <button class="btn" type="button" onclick="logout()">🚪 나가기</button>
      </div>
      <div class="houses">${cards}</div>
      ${LOBBY.length < 2 ? `<div class="memo" style="margin-top:14px">아직 이웃이 없어요. 친구에게 이 링크와 동네 코드를 알려 주면 이사 올 수 있어요.</div>` : ''}
      ${!hasRecords(HOME) ? `<div class="memo" style="margin-top:8px">💡 예전 푸딩이네 기록이 있다면, 내 집에 들어가서 ⚙️ → 백업 파일 가져오기로 옮길 수 있어요.</div>` : ''}
    </div>`);
  }
  function visitHouse(uid) {
    const p = LOBBY.find(x => x.user_id === uid);
    if (!p) return;
    if (uid === ME.id) { VISIT = null; DB = HOME; }
    else { VISIT = p; DB = visitDB(p); }
    const bar = document.getElementById('visitBar');
    bar.hidden = !VISIT;
    bar.innerHTML = VISIT ? `<span>👋 ${esc(homeOf(VISIT.name))}에 놀러 왔어요 · 둘러보기만 할 수 있어요</span>
      <span><button class="btn" type="button" onclick="visitHouse('${ME.id}')">🏡 내 집으로</button>
      <button class="btn" type="button" onclick="goLobby()">🏘️ 로비</button></span>` : '';
    hideGate();
    refreshLiving();
    const hello = VISIT ? VISIT_LINES()[0] : todayLine() || '어서 와! 오늘은 뭘 적어 볼까?';
    document.getElementById('bubbleText').textContent = hello.length > 19 ? hello.slice(0, 18) + '…' : hello;
  }
  async function logout() {
    await flushSave();
    try { localStorage.removeItem(BEFORE_IMPORT_KEY); } catch (e) {}
    await SB.auth.signOut();
    ME = MY_PROFILE = VISIT = HOME = null;
    DB = normalize({});
    document.getElementById('visitBar').hidden = true;
    refreshLiving();
    showAuth('login');
  }

  async function boot() {
    const cfg = window.PUDDING_CONFIG || {};
    if (!window.supabase || !cfg.SUPABASE_URL || !cfg.SUPABASE_KEY) { showConfigGate(); return; }
    try { SB = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_KEY); }
    catch (e) { showConfigGate(); return; }
    const { data } = await SB.auth.getSession();
    if (data.session) afterLogin(data.session); else showAuth('login');
  }

  // ---- 시작 ----
  refreshLiving();
  boot();
  paint();
  setInterval(paint, 1000);
  // 자정이 지나면 오늘 일정 수를 다시 세요
  let lastDay = ymd(new Date());
  setInterval(() => { const d = ymd(new Date()); if (d !== lastDay) { lastDay = d; refreshLiving(); } }, 60 * 1000);
</script>
</body>
</html>
