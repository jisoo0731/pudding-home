<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나만의 집</title>
<link rel="icon" type="image/png" href="pudding.png">
<style>
  :root {
    --bg: #FFF1F1;
    --ink: #5A4038;
    --ink-soft: #9A7C72;
    --card: #FFFBF8;
    --line: #F4D6DA;
    --accent: #F9B8C6;
    --accent-dark: #EE8FA6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  .app { max-width: 960px; margin: 0 auto; padding: 16px; }

  /* 맨 위 상태바 */
  .hud {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 2px solid var(--line);
    border-radius: 18px; padding: 10px 16px; margin-bottom: 12px;
  }
  .hud { position: relative; }
  .hud .lv-btn {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; border: 0; background: none;
    padding: 0; margin: 0; font: inherit; color: inherit; text-align: left; cursor: pointer;
  }
  .hud .lv-btn:hover { background: none; }
  .hud .lv-btn:hover .lv { color: var(--accent-dark); }
  .lv { font-weight: 800; font-size: 18px; white-space: nowrap; }
  .xp { flex: 1; min-width: 80px; display: block; }
  .xp-bar { display: block; height: 12px; background: #FBE4E7; border-radius: 99px; overflow: hidden; }
  .xp-fill { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-dark)); border-radius: 99px; transition: width .5s; }
  .xp-text { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 3px; }
  /* +10 XP 떠오르기 */
  .xp-pop {
    position: absolute; left: 50%; top: 100%; transform: translate(-50%, 0); z-index: 30; pointer-events: none;
    background: var(--accent-dark); color: #fff; font-weight: 800; font-size: 14px; border-radius: 99px; padding: 4px 12px; opacity: 0;
  }
  .xp-pop.minus { background: #A99A93; }
  .xp-pop.show { animation: xpPop 1.3s ease-out; }
  @keyframes xpPop {
    0% { opacity: 0; transform: translate(-50%, 6px) scale(.8); }
    15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
    70% { opacity: 1; transform: translate(-50%, -6px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -16px); }
  }
  /* 레벨 업 축하 */
  .levelup {
    position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
    background: rgba(255, 241, 241, .55); cursor: pointer;
  }
  .levelup.show { display: flex; }
  .lu-card {
    display: flex; flex-direction: column; align-items: center; gap: 4px; background: #fff;
    border: 4px solid var(--accent-dark); border-radius: 8px; padding: 22px 36px; animation: luPop .5s ease-out;
    box-shadow: 0 12px 40px rgba(224, 96, 126, .35);
  }
  .lu-star { font-size: 44px; animation: luSpin 1s ease-out; }
  .lu-card b { font-size: 26px; color: var(--accent-dark); }
  .lu-card span { font-size: 18px; font-weight: 800; }
  .lu-card small { color: var(--ink-soft); }
  @keyframes luPop { 0% { transform: scale(.5); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes luSpin { from { transform: rotate(-30deg) scale(.6); } to { transform: rotate(0) scale(1); } }
  /* 가구 상점 */
  .chime { animation: swing 3s ease-in-out infinite; transform-box: fill-box; transform-origin: top center; }
  @keyframes swing { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  .flame { animation: flicker 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
  @keyframes flicker { 0%, 100% { transform: scale(1, 1); } 40% { transform: scale(.85, 1.12); } 70% { transform: scale(1.08, .92); } }
  .steam { animation: steam 2.4s ease-in-out infinite; }
  @keyframes steam { 0%, 100% { opacity: .2; transform: translateY(2px); } 50% { opacity: .9; transform: translateY(-2px); } }
  .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-top: 12px; }
  .shop-card {
    display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
    background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 14px 12px;
  }
  .shop-card .sc-emoji { font-size: 40px; line-height: 1.1; }
  .shop-card b { font-size: 16px; }
  .shop-card .memo { min-height: 34px; }
  .shop-card .sc-price { font-size: 13px; font-weight: 800; color: var(--accent-dark); margin: 2px 0 6px; }
  .shop-card.owned { background: #F3FBF4; border-color: #B9DFC1; }
  .shop-card.owned .sc-price { color: #4E8A62; }
  .shop-card.locked { opacity: .55; }
  .shop-card .btn { width: 100%; }
  .shop-card .btn:disabled { cursor: default; color: var(--ink-soft); background: #F7F1EE; }
  .xp-have { color: var(--accent-dark) !important; }

  /* XP 받는 법 */
  .xp-rules .row b { color: var(--accent-dark); }
  .hud button {
    border: 2px solid var(--line); background: #fff; border-radius: 12px;
    padding: 7px 12px; font: inherit; font-size: 14px; cursor: pointer; color: var(--ink);
  }
  .hud button:hover { background: #FFE8EC; }

  /* 거실 */
  .room-wrap { position: relative; border-radius: 24px; overflow: hidden; border: 3px solid var(--line); }
  svg.room { display: block; width: 100%; height: auto; }
  .hot { cursor: pointer; transition: filter .15s, transform .15s; transform-box: fill-box; transform-origin: center; }
  .hot:hover { filter: drop-shadow(0 0 8px #FFC2D1) brightness(1.05); }
  .tag { font-size: 15px; font-weight: 800; fill: var(--ink); pointer-events: none; }
  .pudding { animation: bob 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
  @keyframes bob { 0%,100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-4px) scaleY(1.02); } }
  .snow circle { animation: fall linear infinite; }
  @keyframes fall { from { transform: translateY(-20px); } to { transform: translateY(150px); } }
  .bulb { animation: twinkle 1.6s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .35; } }

  /* 오늘 카드 */
  .today {
    margin-top: 12px; background: var(--card); border: 2px solid var(--line);
    border-radius: 18px; padding: 14px 16px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  .today .item { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; cursor: pointer; }
  .today .item:hover { background: #FFEFF2; }
  .today .k { font-size: 13px; color: var(--ink-soft); }
  .today .v { font-size: 16px; font-weight: 800; margin-top: 2px; }
  @media (max-width: 640px) { .today { grid-template-columns: repeat(2, 1fr); } }

  /* 오늘판 */
  .board {
    margin-top: 12px; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 14px 16px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  }
  .board .col { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; min-width: 0; }
  .board h4 { margin: 0 0 6px; font-size: 14px; display: flex; justify-content: space-between; }
  .board h4 .n { color: var(--ink-soft); font-weight: 700; }
  .board .row { display: flex; gap: 8px; align-items: baseline; padding: 4px 6px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .board .row:hover { background: #FFEFF2; }
  .board .row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board .row .tag { font-size: 12px; font-weight: 800; white-space: nowrap; color: var(--ink-soft); }
  .board .row .tag.late { color: #C0392B; }
  .board .row .tag.soon { color: #D9822B; }
  .board .none, .board .more { font-size: 13px; color: var(--ink-soft); padding: 4px 6px; }
  @media (max-width: 640px) { .board { grid-template-columns: 1fr; } }

  /* 공간(방) 창 */
  .panel-bg {
    position: fixed; inset: 0; background: rgba(90,64,56,.3);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .panel-bg.open { display: flex; }
  .panel {
    width: 100%; max-width: 720px; max-height: 90vh; padding: 20px 20px 32px;
    background: var(--card); border-radius: 22px; border: 3px solid var(--line);
    /* 아래에 내용이 더 있다는 걸 알 수 있게 스크롤바를 늘 보여 줘요 */
    overflow-y: scroll;
  }
  .panel::-webkit-scrollbar { width: 16px; }
  .panel::-webkit-scrollbar-track { background: #F6D5DC; border-left: 1px solid #E8B9C3; }
  .panel::-webkit-scrollbar-thumb { background: #D9708A; border: 3px solid #F6D5DC; border-radius: 8px; min-height: 48px; }
  .panel::-webkit-scrollbar-thumb:hover { background: #C25670; }
  /* 창이 열려 있을 땐 뒤의 거실은 스크롤되지 않게 (스크롤바가 창 하나에만 있도록) */
  body.modal-open { overflow: hidden; }
  .more-hint {
    position: fixed; transform: translateX(-50%); z-index: 5; display: none;
    border: 2px solid #D9708A; background: #fff; color: #C25670; border-radius: 99px;
    padding: 5px 14px; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer;
    box-shadow: 0 4px 12px rgba(90,64,56,.18);
  }
  .more-hint:hover { background: #FFE8EC; }
  /* 방 창 · 확인 창: 각진 모서리 + 또렷한 테두리 */
  .panel.square, .dlg-bg .dlg { --line: #E2B4BD; border-radius: 6px; }
  .panel.square *, .dlg-bg .dlg * { border-radius: 3px !important; }
  .panel.square .hp-bar { border-radius: 4px !important; }
  .panel h2 { margin: 0 0 4px; font-size: 22px; }
  .panel .sub { color: var(--ink-soft); font-size: 14px; margin-bottom: 14px; }
  .panel .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .panel .close { float: right; border: 0; background: #FBE4E7; border-radius: 10px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .soon { margin-top: 14px; font-size: 13px; color: var(--ink-soft); }

  /* 공통 버튼 · 입력칸 */
  .btn {
    border: 2px solid var(--line); background: #fff; border-radius: 12px;
    padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; color: var(--ink);
  }
  .btn:hover { background: #FFE8EC; }
  .btn.primary { background: var(--accent); border-color: var(--accent-dark); font-weight: 800; }
  .icon-btn { border: 0; background: none; cursor: pointer; font-size: 16px; padding: 4px; border-radius: 8px; }
  .icon-btn:hover { background: #FFE8EC; }
  .form { display: grid; grid-template-columns: 120px 1fr; gap: 8px; margin-top: 10px; }
  .form input {
    border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px;
    font: inherit; font-size: 14px; background: #fff; color: var(--ink); min-width: 0;
  }
  .form input:focus { outline: none; border-color: var(--accent-dark); }
  .form .full { grid-column: 1 / -1; }
  .form .actions { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; }
  .empty { color: var(--ink-soft); font-size: 14px; padding: 10px 0; }
  .sec { margin-top: 18px; }
  .sec h3 { font-size: 16px; margin: 0 0 6px; }

  /* 달력 */
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 10px; }
  .cal-head b { font-size: 18px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .dow { text-align: center; font-size: 12px; color: var(--ink-soft); padding: 4px 0; }
  .cal .sun, .cal .sun .n { color: #E0607E; }
  .cal .sat, .cal .sat .n { color: #6D8DB0; }
  .cal .day {
    min-height: 66px; background: #fff; border: 2px solid #F7E6E8; border-radius: 12px;
    padding: 4px 5px; cursor: pointer; overflow: hidden; min-width: 0;
  }
  .cal .day:hover { background: #FFF3F5; }
  .cal .day.other { opacity: .4; }
  .cal .day.sel { border-color: var(--accent-dark); background: #FFF3F5; }
  .cal .day .n { font-size: 13px; font-weight: 700; display: inline-block; }
  .cal .day.is-today .n { background: var(--accent-dark); color: #fff; border-radius: 99px; padding: 0 7px; }
  .chip {
    display: block; font-size: 11px; background: #FDE3E8; color: var(--ink); border-radius: 6px;
    padding: 1px 4px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .more { font-size: 11px; color: var(--ink-soft); }
  .ev { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--line); }
  .ev .t { font-weight: 800; min-width: 52px; color: var(--accent-dark); font-size: 14px; }
  .ev .body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .ev .memo { font-size: 12px; color: var(--ink-soft); }
  .dday { font-size: 12px; background: #FDE3E8; border-radius: 99px; padding: 2px 8px; white-space: nowrap; }
  @media (max-width: 640px) {
    .cal .day { min-height: 46px; }
    .chip { font-size: 0; height: 6px; padding: 0; }
    .form { grid-template-columns: 1fr; }
  }

  /* 업무 */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 10px; }
  .tab {
    border: 2px solid var(--line); background: #fff; border-radius: 99px; padding: 5px 12px;
    font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tab:hover { background: #FFE8EC; }
  .tab.on { background: var(--accent); border-color: var(--accent-dark); font-weight: 800; }
  .tab.add { border-style: dashed; color: var(--ink-soft); }
  .work-form { grid-template-columns: 1fr 1fr auto; }
  .form select {
    border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit;
    font-size: 14px; background: #fff; color: var(--ink); min-width: 0;
  }
  .form .check { display: flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; cursor: pointer; }
  .form .check input { width: 18px; height: 18px; accent-color: #E0607E; }
  .task { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--line); }
  .task > input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent-dark); flex: none; cursor: pointer; }
  .task .body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .task.done .title { text-decoration: line-through; color: var(--ink-soft); }
  .meta { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
  .badge { font-size: 11px; border-radius: 99px; padding: 1px 8px; background: #F5EDE8; color: var(--ink-soft); white-space: nowrap; }
  .badge.urgent { background: #FDE0E4; color: #D04A5E; font-weight: 700; }
  .badge.late { background: #E0607E; color: #fff; font-weight: 700; }
  .badge.soon { background: #FFE3C2; color: #B5651D; font-weight: 700; }
  .badge.proj { background: #E3F1E7; color: #4E8A62; }
  .task .title { font-size: 15px; }
  .task .detail {
    font-size: 13px; color: var(--ink-soft); white-space: pre-wrap; line-height: 1.5; margin-top: 2px; cursor: pointer;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .task .detail.open { display: block; background: #FFF7F2; border-radius: 8px; padding: 6px 8px; }
  .work-form textarea {
    border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 14px;
    line-height: 1.5; background: #fff; color: var(--ink); resize: vertical; min-width: 0;
  }
  .work-form textarea:focus { outline: none; border-color: var(--accent-dark); }
  .due {
    flex: none; min-width: 92px; text-align: center; border-radius: 12px; padding: 5px 10px;
    background: #F5EDE8; color: var(--ink); line-height: 1.3;
  }
  .due b { display: block; font-size: 15px; }
  .due span { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .due.soon { background: #FFE3C2; }
  .due.soon span { color: #B5651D; }
  .due.late { background: #E0607E; color: #fff; }
  .due.late span { color: #fff; }
  .due.none { background: none; border: 2px dashed var(--line); padding: 8px 10px; }
  .due.done { background: none; opacity: .7; }
  details summary { cursor: pointer; color: var(--ink-soft); font-size: 14px; margin-top: 10px; }
  .note {
    width: 100%; min-height: 120px; resize: vertical; border: 2px solid var(--line); border-radius: 12px;
    padding: 10px 12px; font: inherit; font-size: 14px; line-height: 1.6; background: #FFFDF6; color: var(--ink);
  }
  .note:focus { outline: none; border-color: var(--accent-dark); }
  .memo-tag { font-size: 12px; font-weight: 400; color: var(--ink-soft); }
  .note-state { font-size: 12px; font-weight: 400; color: #4E8A62; }
  @media (max-width: 640px) { .work-form { grid-template-columns: 1fr 1fr; } }

  /* 가계부 */
  .plus { color: #3E8E62; }
  .minus { color: #D04A5E; }
  .fixed { color: #7A6BB0; }
  .memo { font-size: 12px; color: var(--ink-soft); font-weight: 400; }
  .flow { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 4px 14px; }
  .flow .line {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 15px;
  }
  .flow .line b { white-space: nowrap; font-size: 16px; }
  .flow .sub-list { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .flow .total { border-bottom: 0; border-top: 2px solid var(--line); font-weight: 800; font-size: 16px; }
  .flow .total b { font-size: 20px; }
  .flow .right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .flow .hint { font-size: 12px; padding-bottom: 8px; }

  .btn.mini { font-size: 12px; padding: 3px 9px; margin-top: 6px; }
  .flow .fold {
    width: 100%; background: none; border: 0; border-bottom: 1px dashed var(--line);
    font: inherit; color: inherit; text-align: left; cursor: pointer;
  }
  .flow .fold:hover { background: #FFF5F6; }
  .flow .caret { font-size: 12px; color: var(--accent-dark); font-weight: 700; margin-left: 4px; }
  .fixed-detail { background: #FBF8FE; border-bottom: 1px dashed var(--line); padding: 4px 8px 10px 26px; }
  .fx-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 14px; }
  .fx-row .em { font-size: 16px; }
  .fx-row .body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .fx-row .cat { font-size: 12px; color: var(--ink-soft); margin-left: 6px; }
  .fx-row b { white-space: nowrap; }
  .copy-box { margin-top: 10px; background: #fff; border: 2px solid var(--accent-dark); border-radius: 16px; padding: 12px 14px; }
  .copy-head { display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px; }
  .copy-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .copy-row label { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; cursor: pointer; }
  .copy-row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent-dark); flex: none; }
  .copy-row .body { min-width: 0; overflow-wrap: anywhere; }
  .copy-row .cat { display: block; font-size: 12px; color: var(--ink-soft); }
  .copy-amt {
    width: 120px; text-align: right; border: 2px solid var(--line); border-radius: 8px; padding: 6px 8px;
    font: inherit; font-size: 15px; font-weight: 800; color: var(--ink); background: #fff;
  }
  .copy-amt:focus { outline: none; border-color: var(--accent-dark); }

  /* 용돈 생명바 */
  .hp { margin-top: 10px; background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; }
  .hp .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
  .hp .label { font-weight: 800; font-size: 15px; }
  .hp-bar { position: relative; height: 26px; margin-top: 8px; background: #4A3B35; border-radius: 10px; padding: 3px; }
  .hp-bar > i {
    display: block; height: 100%; border-radius: 7px; transition: width .4s;
    background: linear-gradient(180deg, #9BEBA6, #4CBF5C); box-shadow: inset 0 -4px 0 rgba(0,0,0,.12);
  }
  .hp-bar.mid > i { background: linear-gradient(180deg, #FFE68A, #F2B728); }
  .hp-bar.low > i { background: linear-gradient(180deg, #FFA3B0, #E0506A); animation: blink 1.1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .5; } }
  .hp-bar span {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.65);
  }

<script>
  // ---- 공통 도구 ----
  const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ---- 앱 안 확인 · 입력 창 (브라우저 기본 창은 막혀 있을 수 있어서 직접 만들어요) ----
  let dlgDone = null;
  function dialog(message, { input = false, value = '', numeric = false, okText = '확인' } = {}) {
    if (dlgDone) dlgDone(null);
    const box = document.getElementById('dlgInput');
    document.getElementById('dlgMsg').textContent = message;
    document.getElementById('dlgYes').textContent = okText;
    box.style.display = input ? '' : 'none';
    box.className = numeric ? 'num' : '';
    box.inputMode = numeric ? 'numeric' : 'text';
    box.value = value;
    box.oninput = numeric ? () => formatAmount(box) : null;
    document.getElementById('dlgBg').classList.add('open');
    (input ? box : document.getElementById('dlgYes')).focus();
    if (input) box.select();
    return new Promise(resolve => {
      dlgDone = result => {
        dlgDone = null;
        document.getElementById('dlgBg').classList.remove('open');
        resolve(result);
      };
    });
  }
  const askConfirm = (message, okText) => dialog(message, { okText }).then(r => r !== null);
  const askText = (message, value = '', numeric = false) => dialog(message, { input: true, value, numeric });
  document.getElementById('dlg').addEventListener('submit', e => {
    e.preventDefault();
    if (dlgDone) dlgDone(document.getElementById('dlgInput').value);
  });
  document.getElementById('dlgNo').onclick = () => dlgDone && dlgDone(null);
  // ---- 저장소 (이 컴퓨터 브라우저 안에 저장) ----
  const STORE_KEY = 'my-home:v1';
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
  // 기록 id는 영문 · 숫자 · _ · - 만 (백업 파일 속 id에 코드가 숨어 들어오지 못하게)
  const ID_RE = /^[A-Za-z0-9_-]{1,40}$/;

  function validSchedule(s) {
    return !!s && typeof s.id === 'string' && ID_RE.test(s.id) && DATE_RE.test(s.date)
      && typeof s.title === 'string' && s.title.trim() !== '' && s.title.length <= 100
      && typeof s.time === 'string' && (s.time === '' || TIME_RE.test(s.time))
      && typeof s.memo === 'string' && s.memo.length <= 300;
  }
  function validTask(t) {
    return !!t && typeof t.id === 'string' && ID_RE.test(t.id)
      && typeof t.title === 'string' && t.title.trim() !== '' && t.title.length <= 100
      && typeof t.due === 'string' && (t.due === '' || DATE_RE.test(t.due))
      && typeof t.urgent === 'boolean' && typeof t.done === 'boolean'
      && typeof t.doneAt === 'string' && (t.doneAt === '' || DATE_RE.test(t.doneAt))
      && typeof t.project === 'string' && t.project.length <= 30
      && (t.detail === undefined || (typeof t.detail === 'string' && t.detail.length <= 2000));
  }
  const validProject = p => typeof p === 'string' && p.trim() !== '' && p.length <= 30;
  const MAX_WON = 10000000000; // 100억 원까지
  function tripDays(t) { return Math.round((parseYmd(t.end) - parseYmd(t.start)) / 86400000) + 1; }
  function validTrip(t) {
    return !!t && typeof t.id === 'string' && ID_RE.test(t.id) && typeof t.name === 'string' && t.name.trim() !== '' && t.name.length <= 40
      && DATE_RE.test(t.start) && DATE_RE.test(t.end) && t.end >= t.start && tripDays(t) <= 60;
  }
  // 여행 안의 일정 · 준비물 · 경비도 한 줄씩 검사해요
  function normalizeTrip(t) {
    const n = tripDays(t);
    const arr = v => Array.isArray(v) ? v : [];
    const inDay = d => Number.isInteger(d) && d >= 0 && d < n;
    return {
      id: t.id, name: t.name, start: t.start, end: t.end,
      plans: arr(t.plans).filter(p => !!p && typeof p.id === 'string' && ID_RE.test(p.id) && inDay(p.day)
        && typeof p.title === 'string' && p.title.trim() !== '' && p.title.length <= 100
        && typeof p.time === 'string' && (p.time === '' || TIME_RE.test(p.time))
        && typeof p.memo === 'string' && p.memo.length <= 300),
      packs: arr(t.packs).filter(p => !!p && typeof p.id === 'string' && ID_RE.test(p.id)
        && typeof p.text === 'string' && p.text.trim() !== '' && p.text.length <= 60 && typeof p.done === 'boolean'),
      // 예전에 '여행 전'(-1)으로 적은 비용은 1일차로 옮겨요
      costs: arr(t.costs).filter(c => !!c && typeof c.id === 'string' && ID_RE.test(c.id) && (c.day === -1 || inDay(c.day))
        && Number.isInteger(c.amount) && c.amount > 0 && c.amount <= MAX_WON
        && typeof c.cat === 'string' && c.cat.length <= 10 && typeof c.memo === 'string' && c.memo.length <= 100)
        .map(c => c.day === -1 ? { ...c, day: 0 } : c),
    };
  }
  const PACK_DEFAULTS = ['세면도구', '카메라', '여권', '핸드폰', '속옷', '양말', '교통카드', '신용카드', '현금', '옷', '여행서류'];
  // 필수 체크리스트: 처음 열 때는 기본 11개로 시작해요
  function normalizePackList(v) {
    if (!Array.isArray(v)) return PACK_DEFAULTS.map((text, i) => ({ id: 'pk' + i, text, done: false }));
    return v.filter(p => !!p && typeof p.id === 'string' && ID_RE.test(p.id) && typeof p.text === 'string'
      && p.text.trim() !== '' && p.text.length <= 30 && typeof p.done === 'boolean');
  }
  function validMoney(x) {
    return !!x && typeof x.id === 'string' && ID_RE.test(x.id) && DATE_RE.test(x.date)
      && (x.type === 'in' || x.type === 'fixed' || x.type === 'out')
      && Number.isInteger(x.amount) && x.amount > 0 && x.amount <= MAX_WON
      && typeof x.cat === 'string' && x.cat.length <= 10
      && typeof x.memo === 'string' && x.memo.length <= 100;
  }

  // 형식이 틀린 줄만 건너뛰고 나머지는 지켜요
  function normalize(obj) {
    const base = obj && typeof obj === 'object' && !Array.isArray(obj) ? obj : {};
    const list = (key, ok) => Array.isArray(base[key]) ? base[key].filter(ok) : [];

    // 내용 칸이 생기기 전에 적은 할 일은 내용을 빈칸으로 채워요
    const tasks = list('tasks', validTask).map(t => ({ detail: '', ...t }));
    const projects = [...new Set(list('projects', validProject).concat(tasks.map(t => t.project).filter(Boolean)))];
    const workNotes = {};
    if (base.workNotes && typeof base.workNotes === 'object') {
      for (const [k, v] of Object.entries(base.workNotes)) {
        if (typeof v === 'string' && v.length <= 5000 && (k === '' || projects.includes(k))) workNotes[k] = v;
      }
    }
    const budgets = {};
    if (base.budgets && typeof base.budgets === 'object') {
      for (const [k, v] of Object.entries(base.budgets)) {
        if (/^\d{4}-\d{2}$/.test(k) && Number.isInteger(v) && v >= 0 && v <= MAX_WON) budgets[k] = v;
      }
    }
    const db = { ...base, schedules: list('schedules', validSchedule), tasks, projects, workNotes, money: list('money', validMoney), budgets,
      trips: list('trips', validTrip).map(normalizeTrip), packList: normalizePackList(base.packList),
      lastBackup: typeof base.lastBackup === 'string' && DATE_RE.test(base.lastBackup) ? base.lastBackup : '' };
    const x = base.xp;
    const okXP = !!x && Number.isInteger(x.total) && x.total >= 0 && x.total <= 10000000
      && Number.isInteger(x.spent) && x.spent >= 0 && x.spent <= x.total;
    // XP가 아직 없으면(처음 켰거나 예전 기록) 지금까지 적은 기록만큼 XP를 채워 줘요
    db.xp = okXP ? { total: x.total, spent: x.spent } : { total: xpFromRecords(db), spent: 0 };
    // 가구: 산 것(owned) 중에서 거실에 놓은 것(placed)만 보여요
    const f = base.furniture || {};
    const owned = [...new Set(Array.isArray(f.owned) ? f.owned.filter(id => FURNITURE.some(it => it.id === id)) : [])];
    db.furniture = { owned, placed: [...new Set(Array.isArray(f.placed) ? f.placed.filter(id => owned.includes(id)) : [])] };
    return db;
  }

  // ---- 가구 목록 (가격 · 몇 레벨부터 살 수 있는지) ----
  // place: 상점 탭 · slot: 같은 slot은 하나만 놓을 수 있어요 (예: 머리에 쓰는 것)
  const FURNITURE = [
    { id: 'curtain', place: 'window', emoji: '🌸', name: '꽃 커튼', price: 40, lv: 1, desc: '창문 양쪽에 분홍 커튼을 달아요' },
    { id: 'cactus', place: 'window', emoji: '🌵', name: '창가 선인장', price: 30, lv: 1, desc: '창틀에 선인장 화분 두 개' },
    { id: 'stars', place: 'window', emoji: '⭐', name: '별 스티커', price: 60, lv: 3, desc: '창문 유리에 반짝 별을 붙여요' },
    { id: 'chime', place: 'window', emoji: '🎐', name: '풍경', price: 80, lv: 4, desc: '창가에서 살랑살랑 흔들려요' },
    { id: 'mug', place: 'desk', emoji: '☕', name: '머그컵', price: 20, lv: 1, desc: '김이 모락모락 나는 하트 머그' },
    { id: 'vase', place: 'desk', emoji: '🌷', name: '튤립 꽃병', price: 40, lv: 2, desc: '연필꽂이 옆에 튤립 세 송이' },
    { id: 'candle', place: 'desk', emoji: '🕯️', name: '향초', price: 70, lv: 3, desc: '스탠드 아래에서 불꽃이 일렁여요' },
    { id: 'frame', place: 'wall', emoji: '🖼️', name: '하트 액자', price: 30, lv: 1, desc: '시계 아래 벽에 걸어요' },
    { id: 'garland', place: 'wall', emoji: '🎏', name: '가랜드', price: 50, lv: 2, desc: '천장에 알록달록 깃발을 달아요' },
    { id: 'polaroid', place: 'wall', emoji: '📷', name: '폴라로이드 줄', price: 90, lv: 4, desc: '문 위에 추억 사진을 걸어요' },
    { id: 'bear', place: 'floor', emoji: '🧸', name: '곰인형', price: 40, lv: 1, desc: '러그 위에서 푸딩이랑 놀아요' },
    { id: 'plant', place: 'floor', emoji: '🪴', name: '큰 화분', price: 60, lv: 2, desc: '책상 옆에 초록 잎을 놓아요' },
    { id: 'sofa', place: 'floor', emoji: '🛋️', name: '핑크 소파', price: 120, lv: 3, desc: '문 앞에 폭신한 소파를 놓아요' },
    { id: 'cat', place: 'floor', emoji: '🐱', name: '고양이 친구', price: 150, lv: 4, desc: '소파가 있으면 소파 위에서 자요' },
    { id: 'tree', place: 'floor', emoji: '🎄', name: '작은 트리', price: 120, lv: 5, desc: '창문 아래에 반짝이는 트리' },
    { id: 'rainbow', place: 'floor', emoji: '🌈', name: '무지개 러그', price: 200, lv: 5, desc: '러그를 무지개색으로 바꿔요' },
    { id: 'ribbon', place: 'pudding', slot: 'head', emoji: '🎀', name: '리본', price: 50, lv: 2, desc: '푸딩 귀에 분홍 리본을 달아요' },
    { id: 'scarf', place: 'pudding', emoji: '🧣', name: '빨간 목도리', price: 60, lv: 3, desc: '민트 스카프를 빨간 목도리로' },
    { id: 'flower', place: 'pudding', slot: 'head', emoji: '🌼', name: '꽃 화관', price: 100, lv: 4, desc: '푸딩 머리에 꽃을 둘러요' },
    { id: 'crown', place: 'pudding', slot: 'head', emoji: '👑', name: '왕관', price: 300, lv: 7, desc: '열심히 기록한 푸딩에게 왕관을!' },
  ];
  const SHOP_TABS = [['all', '전체'], ['window', '🪟 창문'], ['desk', '📝 책상'], ['wall', '🖼️ 벽'], ['floor', '🛋️ 바닥'], ['pudding', '🍮 푸딩']];

  // ---- XP 규칙 ----
  const XP = { schedule: 10, task: 5, taskDone: 15, money: 10, trip: 20, plan: 10, cost: 5 };
  function xpFromRecords(db) {
    return db.schedules.length * XP.schedule
      + db.tasks.length * XP.task + db.tasks.filter(t => t.done).length * XP.taskDone
      + db.money.length * XP.money
      + db.trips.reduce((s, t) => s + XP.trip + t.plans.length * XP.plan + t.costs.length * XP.cost, 0);
  }
  // Lv.1→2는 50 XP, 그다음부터 레벨마다 25 XP씩 더 필요해요
  function levelInfo(total) {
    let lv = 1, need = 50, cur = total;
    while (cur >= need) { cur -= need; lv++; need = 50 + (lv - 1) * 25; }
    return { lv, cur, need };
  }

  // DB: 지금 화면에 보이는 집 · HOME: 내 집 기록 · VISIT: 놀러 간 집의 문패 (내 집이면 null)
  let DB = normalize({});
  let HOME = null, VISIT = null, ME = null, MY_PROFILE = null, SB = null;

  // 기록은 Supabase에 저장해요. 고칠 때마다 바로 보내지 않고 잠깐 모았다가 한 번에 보내요
  let saveTimer = null, saving = Promise.resolve();
  function saveDB() {
    if (VISIT || !ME) return false; // 남의 집에서는 아무것도 저장하지 않아요
    HOME = DB;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 600);
    return true;
  }
  function flushSave() {
    if (!saveTimer) return saving;
    clearTimeout(saveTimer);
    saveTimer = null;
    if (!ME || !HOME) return saving;
    const uid = ME.id, db = HOME;
    saving = saving.then(async () => {
      const now = new Date().toISOString();
      const r1 = await SB.from('homes').upsert({ user_id: uid, data: db, updated_at: now });
      if (r1.error) throw r1.error;
      const r2 = await SB.from('profiles').update({ public_data: publicData(db), updated_at: now }).eq('user_id', uid);
      if (r2.error) throw r2.error;
    }).catch(e => { console.error(e); toast('저장하지 못했어요. 인터넷 연결을 확인해 주세요'); });
    return saving;
  }
  window.addEventListener('beforeunload', e => { if (saveTimer) { flushSave(); e.preventDefault(); e.returnValue = ''; } });

  // ---- XP 주고 돌려받기 ----
  // 기록을 적으면 +, 지우면 받았던 만큼 - (적었다 지웠다로 XP를 모을 수 없게)
  function gainXP(amount) {
    if (!amount) return;
    const before = levelInfo(DB.xp.total).lv;
    DB.xp.total = Math.max(DB.xp.spent, DB.xp.total + amount);
    saveDB();
    refreshHUD();
    showXPPop(amount);
    const after = levelInfo(DB.xp.total).lv;
    if (after > before) showLevelUp(after);
  }
  let popTimer;
  function showXPPop(amount) {
    const el = document.getElementById('xpPop');
    el.textContent = (amount > 0 ? '+' : '') + amount + ' XP';
    el.classList.toggle('minus', amount < 0);
    el.classList.remove('show');
    void el.offsetWidth; // 애니메이션을 처음부터 다시
    el.classList.add('show');
    clearTimeout(popTimer);
    popTimer = setTimeout(() => el.classList.remove('show'), 1300);
  }
  // '찌아' → '찌아네 집', 이미 '네'로 끝나는 '푸딩이네' → '푸딩이네 집'
  const homeOf = name => name + (name.endsWith('네') ? ' 집' : '네 집');
  const houseName = () => homeOf(VISIT ? VISIT.name : MY_PROFILE ? MY_PROFILE.name : '푸딩');
  function showLevelUp(lv) {
    const box = document.getElementById('levelUp');
    document.getElementById('levelUpLv').textContent = `Lv.${lv} ${houseName()}`;
    box.classList.add('show');
    document.getElementById('bubbleText').textContent = `레벨 업! 고마워 🍮`;
    setTimeout(() => box.classList.remove('show'), 2600);
  }
  function refreshHUD() {
    const { lv, cur, need } = levelInfo(DB.xp.total);
    document.getElementById('hudLv').textContent = `Lv.${lv} ${houseName()}`;
    document.getElementById('hudFill').style.width = Math.round(cur / need * 100) + '%';
    document.getElementById('hudText').textContent = VISIT ? '놀러 온 집이에요' : `다음 레벨까지 ${need - cur} XP · 가진 XP ${DB.xp.total - DB.xp.spent}`;
  }

  // ---- 개인일정 (벽 달력) ----
  const cal = { y: 0, m: 0, sel: '', editId: null };
  const byTime = (a, b) => (a.time || '').localeCompare(b.time || '');

  function schedulesOn(date) { return DB.schedules.filter(s => s.date === date).sort(byTime); }
  function ddayLabel(date) {
    const diff = Math.round((parseYmd(date) - parseYmd(ymd(new Date()))) / 86400000);
    return diff === 0 ? 'D-DAY' : 'D-' + diff;
  }
  function dateLabel(date) {
    const d = parseYmd(date);
    return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEK[d.getDay()]})`;
  }

  function openSchedule() {
    const now = new Date();
    Object.assign(cal, { y: now.getFullYear(), m: now.getMonth(), sel: ymd(now), editId: null });
    renderSchedule();
    document.getElementById('panelBg').classList.add('open');
  }
  function moveMonth(step) {
    const d = new Date(cal.y, cal.m + step, 1);
    cal.y = d.getFullYear(); cal.m = d.getMonth();
    renderSchedule();
  }
  function goToday() { openSchedule(); }
  function selectDay(date) {
    const d = parseYmd(date);
    Object.assign(cal, { y: d.getFullYear(), m: d.getMonth(), sel: date, editId: null });
    renderSchedule();
  }

  function renderSchedule() {
    const today = ymd(new Date());
    const first = new Date(cal.y, cal.m, 1);
    const days = new Date(cal.y, cal.m + 1, 0).getDate();
    const cellCount = Math.ceil((first.getDay() + days) / 7) * 7;

    let grid = WEEK.map((w, i) => `<div class="dow ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('');
    for (let i = 0; i < cellCount; i++) {
      const d = new Date(cal.y, cal.m, 1 - first.getDay() + i);
      const ds = ymd(d);
      const items = schedulesOn(ds);
      const cls = ['day',
        d.getMonth() !== cal.m ? 'other' : '', ds === today ? 'is-today' : '', ds === cal.sel ? 'sel' : '',
        d.getDay() === 0 ? 'sun' : d.getDay() === 6 ? 'sat' : ''].join(' ');
      const chips = items.slice(0, 2).map(s => `<span class="chip">${esc(s.title)}</span>`).join('')
        + (items.length > 2 ? `<span class="more">+${items.length - 2}</span>` : '');
      grid += `<div class="${cls}" onclick="selectDay('${ds}')" role="button" aria-label="${dateLabel(ds)} 일정 ${items.length}개"><span class="n">${d.getDate()}</span>${chips}</div>`;
    }

    // 고른 날의 일정
    const dayItems = schedulesOn(cal.sel);
    const dayList = dayItems.length
      ? dayItems.map(s => `
          <div class="ev">
            <div class="t">${s.time || '하루 종일'}</div>
            <div class="body"><div>${esc(s.title)}</div>${s.memo ? `<div class="memo">${esc(s.memo)}</div>` : ''}</div>
            <button class="icon-btn" type="button" title="고치기" onclick="startEdit('${s.id}')">✏️</button>
            <button class="icon-btn" type="button" title="지우기" onclick="removeSchedule('${s.id}')">🗑️</button>
          </div>`).join('')
      : `<div class="empty">이날은 아직 일정이 없어요. 아래에 적어 보세요 ✍️</div>`;

    const editing = cal.editId ? DB.schedules.find(s => s.id === cal.editId) : null;
    const form = `
      <form class="form" onsubmit="submitSchedule(event)" autocomplete="off">
        <input type="time" name="evTime" value="${editing ? editing.time : ''}" aria-label="시간 (선택)">
        <input type="text" name="evTitle" maxlength="100" placeholder="무슨 일정인가요? (예: 친구랑 카페)" value="${editing ? esc(editing.title) : ''}" required>
        <input class="full" type="text" name="evMemo" maxlength="300" placeholder="메모 (선택)" value="${editing ? esc(editing.memo) : ''}">
        <div class="actions">
          ${editing ? `<button class="btn" type="button" onclick="cancelEdit()">취소</button>` : ''}
          <button class="btn primary" type="submit">${editing ? '고친 내용 저장' : '+ 일정 추가'}</button>
        </div>
      </form>`;

    // 다가오는 일정 (오늘부터 5개)
    const upcoming = DB.schedules.filter(s => s.date >= today)
      .sort((a, b) => a.date.localeCompare(b.date) || byTime(a, b)).slice(0, 5);
    const upList = upcoming.length
      ? upcoming.map(s => `
          <div class="ev" style="cursor:pointer" onclick="selectDay('${s.date}')">
            <div class="t">${dateLabel(s.date).replace(/ \(.\)/, '')}</div>
            <div class="body"><div>${esc(s.title)}</div><div class="memo">${s.time || '하루 종일'}</div></div>
            <span class="dday">${ddayLabel(s.date)}</span>
          </div>`).join('')
      : `<div class="empty">다가오는 일정이 없어요. 달력에서 날짜를 눌러 첫 일정을 적어 보세요.</div>`;

    document.getElementById('panel').innerHTML = `
      <button class="close" type="button" onclick="closePanel()">거실로 ←</button>
      <h2>🗓️ 개인일정</h2>
      <div class="sub">날짜를 누르면 그날 일정을 보고 적을 수 있어요</div>
      <div class="cal-head">
        <button class="btn" type="button" onclick="moveMonth(-1)" aria-label="이전 달">◀</button>
        <b>${cal.y}년 ${cal.m + 1}월</b>
        <span>
          <button class="btn" type="button" onclick="goToday()">오늘</button>
          <button class="btn" type="button" onclick="moveMonth(1)" aria-label="다음 달">▶</button>
        </span>
      </div>
      <div class="cal">${grid}</div>
      <div class="sec">
        <h3>${dateLabel(cal.sel)}${editing ? ' · 고치는 중' : ''}</h3>
        ${dayList}
        ${form}
      </div>
      <div class="sec">
        <h3>⏰ 다가오는 일정</h3>
        ${upList}
      </div>`;
  }

  function submitSchedule(e) {
    e.preventDefault();
    const f = e.target.elements;
    const item = { time: f.evTime.value, title: f.evTitle.value.trim(), memo: f.evMemo.value.trim() };
    if (!item.title) { toast('일정 이름을 적어 주세요'); return; }
    if (item.time && !TIME_RE.test(item.time)) item.time = '';

    if (cal.editId) {
      const s = DB.schedules.find(x => x.id === cal.editId);
      if (s) Object.assign(s, item);
      cal.editId = null;
      if (saveDB()) toast('고친 내용을 저장했어요');
    } else {
      DB.schedules.push({ id: newId(), date: cal.sel, ...item });
      gainXP(XP.schedule);
      if (saveDB()) toast('일정을 적었어요 🍮');
    }
    renderSchedule();
    refreshLiving();
  }
  function startEdit(id) { cal.editId = id; renderSchedule(); document.querySelector('.form input[name=evTitle]').focus(); }
  function cancelEdit() { cal.editId = null; renderSchedule(); }
  async function removeSchedule(id) {
    const s = DB.schedules.find(x => x.id === id);
    if (!s || !(await askConfirm(`'${s.title}' 일정을 지울까요?`))) return;
    DB.schedules = DB.schedules.filter(x => x.id !== id);
    gainXP(-XP.schedule);
    if (cal.editId === id) cal.editId = null;
    if (saveDB()) toast('일정을 지웠어요');
    renderSchedule();
    refreshLiving();
  }

  // ---- 업무 (파란 문) ----
  const ALL = '__all';
  const work = { tab: ALL, editId: null };
  let noteTimer;

  function dueInfo(due) {
    if (!due) return null;
    const diff = Math.round((parseYmd(due) - parseYmd(ymd(new Date()))) / 86400000);
    if (diff < 0) return { cls: 'late', text: `${-diff}일 지남` };
    if (diff === 0) return { cls: 'late', text: '오늘 마감' };
    return { cls: diff <= 2 ? 'soon' : '', text: 'D-' + diff };
  }
  // 마감이 가까운 일이 위로, 마감이 같으면 급한 일이 위로, 마감 없는 일은 맨 아래
  const byDue = (a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (b.urgent - a.urgent);
  const urgentTasks = () => DB.tasks.filter(t => !t.done && t.due && t.due <= ymd(new Date()));

  function openWork() {
    if (work.tab !== ALL && !DB.projects.includes(work.tab)) work.tab = ALL;
    work.editId = null;
    renderWork();
    document.getElementById('panelBg').classList.add('open');
  }
  function setWorkTab(i) { work.tab = i < 0 ? ALL : DB.projects[i]; work.editId = null; renderWork(); }

  async function addProject() {
    const name = ((await askText('새 프로젝트 이름을 적어 주세요 (30자까지)')) || '').trim();
    if (!name) return;
    if (name.length > 30) { toast('프로젝트 이름은 30자까지예요'); return; }
    if (DB.projects.includes(name)) { toast('이미 있는 프로젝트예요'); work.tab = name; renderWork(); return; }
    DB.projects.push(name);
    work.tab = name;
    if (saveDB()) toast(`'${name}' 프로젝트를 만들었어요`);
    renderWork();
  }
  async function removeProject() {
    const name = work.tab;
    if (name === ALL || !(await askConfirm(`'${name}' 프로젝트를 지울까요?\n안에 있던 할 일은 지워지지 않고 '프로젝트 없음'으로 옮겨져요.`))) return;
    DB.tasks.forEach(t => { if (t.project === name) t.project = ''; });
    DB.projects = DB.projects.filter(p => p !== name);
    delete DB.workNotes[name];
    work.tab = ALL;
    if (saveDB()) toast('프로젝트를 지웠어요');
    renderWork();
  }

  function taskRow(t) {
    const md = s => `${+s.slice(5, 7)}/${+s.slice(8)} (${WEEK[parseYmd(s).getDay()]})`;
    const badges = [
      t.urgent && !t.done ? `<span class="badge urgent">🔴 급함</span>` : '',
      work.tab === ALL && t.project ? `<span class="badge proj">📁 ${esc(t.project)}</span>` : '',
    ].join('');
    // 오른쪽 날짜 칸: 할 일은 마감일, 끝낸 일은 끝낸 날
    let dueBox;
    if (t.done) {
      dueBox = t.doneAt ? `<div class="due done"><b>${md(t.doneAt)}</b><span>끝냄 ✔</span></div>` : '';
    } else if (t.due) {
      const d = dueInfo(t.due);
      dueBox = `<div class="due ${d.cls}"><b>${md(t.due)}</b><span>${d.text}</span></div>`;
    } else {
      dueBox = `<div class="due none"><span>마감 없음</span></div>`;
    }
    return `
      <div class="task ${t.done ? 'done' : ''}">
        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask('${t.id}')" aria-label="끝냄 표시">
        <div class="body">
          <div class="title">${esc(t.title)}</div>
          ${t.detail ? `<div class="detail" onclick="this.classList.toggle('open')" title="눌러서 펼치기 · 접기">${esc(t.detail)}</div>` : ''}
          ${badges ? `<div class="meta">${badges}</div>` : ''}
        </div>
        ${dueBox}
        ${t.done ? '' : `<button class="icon-btn" type="button" title="고치기" onclick="startTaskEdit('${t.id}')">✏️</button>`}
        <button class="icon-btn" type="button" title="지우기" onclick="removeTask('${t.id}')">🗑️</button>
      </div>`;
  }

  function renderWork() {
    const inTab = DB.tasks.filter(t => work.tab === ALL || t.project === work.tab);
    const todo = inTab.filter(t => !t.done).sort(byDue);
    const done = inTab.filter(t => t.done).sort((a, b) => b.doneAt.localeCompare(a.doneAt));
    const editing = work.editId ? DB.tasks.find(t => t.id === work.editId) : null;
    const formProject = editing ? editing.project : (work.tab === ALL ? '' : work.tab);
    const noteKey = work.tab === ALL ? '' : work.tab;

    const tabs = `<button class="tab ${work.tab === ALL ? 'on' : ''}" type="button" onclick="setWorkTab(-1)">전체</button>`
      + DB.projects.map((p, i) => `<button class="tab ${work.tab === p ? 'on' : ''}" type="button" onclick="setWorkTab(${i})">📁 ${esc(p)}</button>`).join('')
      + `<button class="tab add" type="button" onclick="addProject()">+ 프로젝트</button>`;

    document.getElementById('panel').innerHTML = `
      <button class="close" type="button" onclick="closePanel()">거실로 ←</button>
      <h2>💼 업무</h2>
      <div class="sub">마감이 가까운 일이 위로 올라와요. 끝낸 일은 체크하세요</div>
      <div class="tabs">${tabs}</div>

      <form class="form work-form" onsubmit="submitTask(event)" autocomplete="off">
        <input class="full" type="text" name="tkTitle" maxlength="100" placeholder="할 일 (예: 주간 보고서 쓰기)" value="${editing ? esc(editing.title) : ''}" required>
        <textarea class="full" name="tkDetail" maxlength="2000" rows="3" placeholder="내용 (선택) · 자세한 설명, 참고 링크, 챙길 것…">${editing ? esc(editing.detail) : ''}</textarea>
        <input type="date" name="tkDue" value="${editing ? editing.due : ''}" aria-label="마감일 (선택)" title="마감일 (선택)">
        <select name="tkProject" aria-label="프로젝트">
          <option value="">프로젝트 없음</option>
          ${DB.projects.map((p, i) => `<option value="${i}" ${p === formProject ? 'selected' : ''}>📁 ${esc(p)}</option>`).join('')}
        </select>
        <label class="check"><input type="checkbox" name="tkUrgent" ${editing && editing.urgent ? 'checked' : ''}> 🔴 급함</label>
        <div class="actions">
          ${editing ? `<button class="btn" type="button" onclick="cancelTaskEdit()">취소</button>` : ''}
          <button class="btn primary" type="submit">${editing ? '고친 내용 저장' : '+ 할 일 추가'}</button>
        </div>
      </form>

      <div class="sec">
        <h3>할 일 ${todo.length}개</h3>
        ${todo.length ? todo.map(taskRow).join('') : `<div class="empty">${inTab.length ? '다 끝냈어요! 오늘도 수고했어요 🍮' : '아직 할 일이 없어요. 위에 첫 할 일을 적어 보세요 ✍️'}</div>`}
        ${done.length ? `<details><summary>끝낸 일 ${done.length}개 보기</summary>${done.map(taskRow).join('')}</details>` : ''}
      </div>

      <div class="sec">
        <h3>📝 업무 메모 <span class="memo-tag">${work.tab === ALL ? '공통' : esc(work.tab)}</span> <span class="note-state" id="noteState"></span></h3>
        <textarea class="note" maxlength="5000" placeholder="회의 내용, 아이디어, 참고할 것… 적으면 바로 저장돼요" oninput="saveNote(this.value)">${esc(DB.workNotes[noteKey] || '')}</textarea>
      </div>

      ${work.tab === ALL ? '' : `<div class="sec"><button class="btn" type="button" onclick="removeProject()">🗑️ '${esc(work.tab)}' 프로젝트 지우기</button></div>`}`;
  }

  function submitTask(e) {
    e.preventDefault();
    const f = e.target.elements;
    const title = f.tkTitle.value.trim();
    if (!title) { toast('할 일을 적어 주세요'); return; }
    const item = {
      title,
      detail: f.tkDetail.value.trim().slice(0, 2000),
      due: DATE_RE.test(f.tkDue.value) ? f.tkDue.value : '',
      project: f.tkProject.value === '' ? '' : (DB.projects[+f.tkProject.value] || ''),
      urgent: f.tkUrgent.checked,
    };
    if (work.editId) {
      const t = DB.tasks.find(x => x.id === work.editId);
      if (t) Object.assign(t, item);
      work.editId = null;
      if (saveDB()) toast('고친 내용을 저장했어요');
    } else {
      DB.tasks.push({ id: newId(), ...item, done: false, doneAt: '' });
      gainXP(XP.task);
      if (saveDB()) toast('할 일을 적었어요 💼');
    }
    renderWork();
    refreshLiving();
  }
  function toggleTask(id) {
    const t = DB.tasks.find(x => x.id === id);
    if (!t) return;
    t.done = !t.done;
    t.doneAt = t.done ? ymd(new Date()) : '';
    gainXP(t.done ? XP.taskDone : -XP.taskDone);
    if (saveDB()) toast(t.done ? '끝! 수고했어 🍮' : '다시 할 일로 옮겼어요');
    renderWork();
    refreshLiving();
  }
  function startTaskEdit(id) { work.editId = id; renderWork(); document.querySelector('.work-form input[name=tkTitle]').focus(); }
  function cancelTaskEdit() { work.editId = null; renderWork(); }
  async function removeTask(id) {
    const t = DB.tasks.find(x => x.id === id);
    if (!t || !(await askConfirm(`'${t.title}' 할 일을 지울까요?`))) return;
    DB.tasks = DB.tasks.filter(x => x.id !== id);
    gainXP(-(XP.task + (t.done ? XP.taskDone : 0)));
    if (work.editId === id) work.editId = null;
    if (saveDB()) toast('할 일을 지웠어요');
    renderWork();
    refreshLiving();
  }
  // 메모는 적는 즉시 기억하고, 손을 멈추면 0.4초 뒤에 저장해요
  function saveNote(value) {
    DB.workNotes[work.tab === ALL ? '' : work.tab] = value.slice(0, 5000);
    const state = document.getElementById('noteState');
    if (state) state.textContent = '저장 중…';
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => {
      const ok = saveDB();
      const s = document.getElementById('noteState');
      if (s) s.textContent = ok ? '✔ 저장됨' : '';
    }, 400);
  }

  // ---- 가계부 (책상 위 다이어리) ----
  // 들어온 돈 − 고정비 − 용돈 = 남은 돈 (→ 자유적금)
  const CATS = {
    in: [['월급', '💰'], ['기타', '✨']],
    fixed: [['통신', '📱'], ['구독료', '📺'], ['보험', '🛡️'], ['적금', '🐷'], ['주거', '🏠'], ['기타', '📌']],
    out: [['식비', '🍚'], ['카페', '☕'], ['교통', '🚌'], ['쇼핑', '🛍️'], ['생활', '🧺'], ['문화', '🎬'], ['기타', '📦']],
  };
  const FREE_SAVING = '자유적금';
  const FALLBACK = { in: '✨', fixed: '📌', out: '📦' };
  const catEmoji = (type, cat) => cat === FREE_SAVING ? '💖' : (CATS[type].find(c => c[0] === cat) || [, FALLBACK[type]])[1];
  const won = n => n.toLocaleString('ko-KR') + '원';
  const money = { y: 0, m: 0, type: 'out', cat: '식비', editId: null, view: 'all', copyOpen: false };
  const monthKey = () => money.y + '-' + pad(money.m + 1);

  // 금액 칸의 글자에서 숫자만 꺼내요 (쉼표, '원', 띄어쓰기는 무시)
  function parseAmount(str) {
    const digits = String(str).replace(/[,\s원]/g, '');
    return /^\d{1,11}$/.test(digits) ? Number(digits) : null;
  }
  function formatAmount(el) {
    const digits = el.value.replace(/\D/g, '').slice(0, 11);
    el.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
  }
  // 용돈: 그 달에 안 정했으면 가장 가까운 지난달 용돈을 이어서 써요 (예전에 정한 '예산'도 여기 들어 있어요)
  function allowanceFor(key) {
    const keys = Object.keys(DB.budgets).filter(k => k <= key).sort();
    return keys.length ? DB.budgets[keys[keys.length - 1]] : 0;
  }
  function monthTotals(key) {
    const t = { inSum: 0, fixedSum: 0, outSum: 0, saved: 0, byCat: {}, fixedByCat: {} };
    DB.money.forEach(x => {
      if (x.date.slice(0, 7) !== key) return;
      if (x.type === 'in') t.inSum += x.amount;
      else if (x.type === 'fixed' && x.cat === FREE_SAVING) t.saved += x.amount;
      else if (x.type === 'fixed') { t.fixedSum += x.amount; t.fixedByCat[x.cat] = (t.fixedByCat[x.cat] || 0) + x.amount; }
      else { t.outSum += x.amount; t.byCat[x.cat] = (t.byCat[x.cat] || 0) + x.amount; }
    });
    t.allowance = allowanceFor(key);
    t.allowanceUsed = Math.max(t.allowance, t.outSum); // 정한 용돈만큼, 더 썼으면 쓴 만큼 빼요
    t.left = t.inSum - t.fixedSum - t.allowanceUsed - t.saved;
    return t;
  }
  // 내 평균 = 100: 용돈 쓴 기록이 있는 지난 석 달을 평균 내요
  // 이번 달이면 지난달들도 같은 날짜까지만 더해요 (8일에 한 달 치와 비교하면 늘 적게 쓴 것처럼 보여서)
  function myAverage(key) {
    const [y, m] = key.split('-').map(Number);
    const isNow = key === ymd(new Date()).slice(0, 7);
    const cutDay = isNow ? new Date().getDate() : 31;
    const months = [];
    for (let back = 1; back <= 12 && months.length < 3; back++) {
      const pk = ymd(new Date(y, m - 1 - back, 1)).slice(0, 7);
      const rows = DB.money.filter(x => x.type === 'out' && x.date.slice(0, 7) === pk);
      if (rows.length) months.push(rows.filter(x => +x.date.slice(8) <= cutDay));
    }
    const avg = { months: months.length, isNow, cutDay, total: 0, byCat: {} };
    months.flat().forEach(x => {
      avg.total += x.amount / months.length;
      avg.byCat[x.cat] = (avg.byCat[x.cat] || 0) + x.amount / months.length;
    });
    return avg;
  }
  const toIndex = (cur, base) => base > 0 ? Math.round(cur / base * 100) : null;

  function openMoney() {
    const now = new Date();
    Object.assign(money, { y: now.getFullYear(), m: now.getMonth(), editId: null, copyOpen: false });
    renderMoney();
    document.getElementById('panel').classList.add('square');
    document.getElementById('panelBg').classList.add('open');
  }
  function moveMoneyMonth(step) {
    const d = new Date(money.y, money.m + step, 1);
    Object.assign(money, { y: d.getFullYear(), m: d.getMonth(), editId: null, copyOpen: false });
    renderMoney();
  }

  // ---- 고정비: 지난달 것 가져오기 ----
  function prevFixed() {
    const prevKey = ymd(new Date(money.y, money.m - 1, 1)).slice(0, 7);
    return DB.money.filter(x => x.type === 'fixed' && x.cat !== FREE_SAVING && x.date.slice(0, 7) === prevKey)
      .sort((a, b) => a.date.localeCompare(b.date));
  }
  // 이번 달에 같은 분류 · 같은 메모의 고정비가 이미 있으면 두 번 넣지 않아요
  const fixedExists = x => DB.money.some(y => y.type === 'fixed' && y.date.slice(0, 7) === monthKey() && y.cat === x.cat && y.memo === x.memo);
  function toggleCopy() { money.copyOpen = !money.copyOpen; renderMoney(); }

  // 고정비 접기 · 펼치기 (마지막 상태를 이 브라우저에 기억해요)
  const FOLD_KEY = 'my-home:fixed-open';
  function isFixedOpen() {
    try { return localStorage.getItem(FOLD_KEY) !== '0'; } catch (e) { return true; }
  }
  function toggleFixed() {
    try { localStorage.setItem(FOLD_KEY, isFixedOpen() ? '0' : '1'); } catch (e) {}
    renderMoney();
  }
  function copyBox() {
    const items = prevFixed();
    const rows = items.map(x => {
      const has = fixedExists(x);
      return `
        <div class="copy-row">
          <label>
            <input type="checkbox" data-id="${x.id}" ${has ? '' : 'checked'}>
            <span class="em">${catEmoji('fixed', x.cat)}</span>
            <span class="body">${esc(x.memo || x.cat)}<span class="cat">${esc(x.cat)} · 매달 ${+x.date.slice(8)}일${has ? ' · 이번 달에 이미 있어요' : ''}</span></span>
          </label>
          <input class="copy-amt" type="text" inputmode="numeric" value="${x.amount.toLocaleString('ko-KR')}" oninput="formatAmount(this)" aria-label="${esc(x.memo || x.cat)} 금액">
          <span>원</span>
        </div>`;
    }).join('');
    return `
      <div class="copy-box">
        <div class="copy-head"><b>📋 ${new Date(money.y, money.m - 1, 1).getMonth() + 1}월 고정비 가져오기</b>
          <span class="memo">가져올 것만 체크하고, 금액이 바뀌었으면 고쳐 주세요</span></div>
        ${rows}
        <div class="dlg-actions">
          <button class="btn" type="button" onclick="toggleCopy()">취소</button>
          <button class="btn primary" type="button" onclick="importFixed()">체크한 것 가져오기</button>
        </div>
      </div>`;
  }
  function importFixed() {
    const lastDay = new Date(money.y, money.m + 1, 0).getDate();
    let count = 0, bad = 0;
    document.querySelectorAll('.copy-row').forEach(row => {
      const cb = row.querySelector('input[type=checkbox]');
      if (!cb.checked) return;
      const src = DB.money.find(x => x.id === cb.dataset.id);
      const amount = parseAmount(row.querySelector('.copy-amt').value);
      if (!src || !amount || amount > MAX_WON) { bad++; return; }
      // 지난달과 같은 날로 넣어요 (31일처럼 이번 달에 없는 날은 말일로)
      const day = Math.min(+src.date.slice(8), lastDay);
      DB.money.push({ id: newId(), date: monthKey() + '-' + pad(day), type: 'fixed', amount, cat: src.cat, memo: src.memo });
      count++;
    });
    if (!count) { toast(bad ? '금액을 숫자로 적어 주세요' : '가져올 항목을 체크해 주세요'); return; }
    gainXP(XP.money * count);
    money.copyOpen = false;
    if (saveDB()) toast(`고정비 ${count}개를 가져왔어요 📋`);
    renderMoney();
    refreshLiving();
  }

  function setMoneyView(v) { money.view = v; renderMoney(); }
  function catPicks() {
    return CATS[money.type].map(([c, e]) => `
      <label class="pick"><input type="radio" name="mCat" value="${c}" ${c === money.cat ? 'checked' : ''} onchange="money.cat = this.value"><span>${e} ${c}</span></label>`).join('');
  }
  // 종류를 바꾸면 분류 칩만 다시 그려요 (적던 금액은 그대로)
  function setMoneyType(type) {
    money.type = type;
    if (!CATS[type].some(c => c[0] === money.cat)) money.cat = CATS[type][0][0];
    document.getElementById('catPicks').innerHTML = catPicks();
  }
  async function setAllowance() {
    const key = monthKey();
    const cur = allowanceFor(key);
    const v = await askText(`${money.m + 1}월 용돈을 얼마로 할까요? (원)\n0을 적으면 용돈 없이 써요`, cur ? cur.toLocaleString('ko-KR') : '', true);
    if (v === null) return;
    const n = parseAmount(v);
    if (n === null || n > MAX_WON) { toast('용돈은 숫자로 적어 주세요'); return; }
    DB.budgets[key] = n;
    if (saveDB()) toast(n ? `${money.m + 1}월 용돈을 ${won(n)}으로 정했어요` : '용돈 없이 쓸게요');
    renderMoney();
    refreshLiving();
  }
  // 남은 돈을 자유적금으로 한 번에 옮겨요
  async function saveLeftover() {
    const key = monthKey();
    const { left } = monthTotals(key);
    if (left <= 0 || !(await askConfirm(`남은 돈 ${won(left)}을 자유적금에 넣을까요?`))) return;
    const today = ymd(new Date());
    const date = today.slice(0, 7) === key ? today : ymd(new Date(money.y, money.m + 1, 0));
    DB.money.push({ id: newId(), date, type: 'fixed', amount: left, cat: FREE_SAVING, memo: '남은 돈 자유적금' });
    gainXP(XP.money);
    if (saveDB()) toast(`💖 자유적금에 ${won(left)} 넣었어요!`);
    renderMoney();
    refreshLiving();
  }

  function renderMoney() {
    const key = monthKey();
    const t = monthTotals(key);
    const editing = money.editId ? DB.money.find(x => x.id === money.editId) : null;
    const today = ymd(new Date());
    const formDate = editing ? editing.date : (today.slice(0, 7) === key ? today : key + '-01');

    // 돈 흐름: 들어온 돈 − 고정비 − 용돈 − 자유적금 = 남은 돈
    const hasPrevFixed = prevFixed().length > 0;
    if (!hasPrevFixed) money.copyOpen = false;
    const fixedItems = DB.money.filter(x => x.type === 'fixed' && x.cat !== FREE_SAVING && x.date.slice(0, 7) === key)
      .sort((a, b) => a.date.localeCompare(b.date));
    const fixedOpen = isFixedOpen();
    const fixedDetail = `
      <div class="fixed-detail">
        ${fixedItems.map(x => `
          <div class="fx-row">
            <span class="em">${catEmoji('fixed', x.cat)}</span>
            <span class="body">${esc(x.memo || x.cat)}<span class="cat">${esc(x.cat)} · 매달 ${+x.date.slice(8)}일</span></span>
            <b class="fixed">${won(x.amount)}</b>
            <button class="icon-btn" type="button" title="고치기" onclick="startMoneyEdit('${x.id}')">✏️</button>
          </div>`).join('') || `<div class="empty">이번 달 고정비가 아직 없어요.</div>`}
        ${hasPrevFixed && !money.copyOpen ? `<button class="btn mini" type="button" onclick="toggleCopy()">📋 지난달 고정비 가져오기</button>` : ''}
      </div>`;
    const allowanceNote = !t.allowance ? '쓴 돈' : t.outSum > t.allowance ? '정한 것보다 더 썼어요' : '정해 둔 돈';
    const flow = `
      <div class="flow">
        <div class="line"><span>💰 들어온 돈</span><b class="plus">+${won(t.inSum)}</b></div>
        <button class="line fold" type="button" onclick="toggleFixed()" aria-expanded="${fixedOpen}">
          <span>🏠 고정비 <span class="memo">${fixedItems.length}개</span> <span class="caret">${fixedOpen ? '▾ 접기' : '▸ 펼치기'}</span></span>
          <b class="fixed">-${won(t.fixedSum)}</b>
        </button>
        ${fixedOpen ? fixedDetail : ''}
        <div class="line"><span>👛 용돈 <span class="memo">${allowanceNote}</span></span><b class="minus">-${won(t.allowanceUsed)}</b></div>
        ${t.saved ? `<div class="line"><span>💖 자유적금</span><b class="fixed">-${won(t.saved)}</b></div>` : ''}
        <div class="line total">
          <span>🐷 남은 돈</span>
          <span class="right">
            <b class="${t.left < 0 ? 'minus' : ''}">${t.left < 0 ? '-' : ''}${won(Math.abs(t.left))}</b>
            ${t.left > 0 ? `<button class="btn primary" type="button" onclick="saveLeftover()">💖 자유적금에 넣기</button>` : ''}
          </span>
        </div>
        ${t.left < 0 ? `<div class="hint minus">들어온 돈보다 ${won(-t.left)} 더 나갔어요</div>` : ''}
      </div>`;

    // 용돈 생명바
    let hp;
    if (t.allowance) {
      const remain = t.allowance - t.outSum;
      const ratio = Math.max(0, remain) / t.allowance;
      const cls = ratio > 0.5 ? '' : ratio > 0.2 ? 'mid' : 'low';
      let hint = `${Math.round((1 - ratio) * 100)}% 썼어요`;
      if (key === today.slice(0, 7)) {
        const daysLeft = new Date(money.y, money.m + 1, 0).getDate() - new Date().getDate() + 1;
        hint = remain > 0 ? `남은 ${daysLeft}일 동안 하루 ${won(Math.floor(remain / daysLeft))}씩 쓸 수 있어요` : '용돈을 다 썼어요. 이번 달은 조금만 버텨 보자 💪';
      }
      hp = `
        <div class="hp">
          <div class="top"><span class="label">👛 남은 용돈</span><button class="btn" type="button" onclick="setAllowance()">용돈 바꾸기</button></div>
          <div class="hp-bar ${cls}"><i style="width:${Math.round(ratio * 100)}%"></i>
            <span>${remain < 0 ? '-' : ''}${won(Math.abs(remain))} / ${won(t.allowance)}</span></div>
          <div class="hint">${hint}</div>
        </div>`;
    } else {
      hp = `<div class="hp"><div class="top"><span>👛 한 달 용돈을 정하면 생명바처럼 줄어드는 게 보여요</span>
        <button class="btn primary" type="button" onclick="setAllowance()">용돈 정하기</button></div></div>`;
    }

    // 용돈 어디에 썼을까? (내 평균 = 100 지수와 함께)
    const avg = myAverage(key);
    const idxTag = (cur, base) => {
      if (!avg.months) return '';
      const n = toIndex(cur, base);
      if (n === null) return `<span class="idx new">처음</span>`;
      const cls = n >= 110 ? 'up' : n <= 90 ? 'down' : '';
      return `<span class="idx ${cls}">${n}${n >= 110 ? ' ▲' : n <= 90 ? ' ▼' : ''}</span>`;
    };
    let idxCard;
    if (!avg.months) {
      idxCard = `<div class="idx-card"><div class="memo">📈 용돈 기록이 한 달 쌓이면 <b>내 평균 = 100</b>으로 이번 달과 비교해 줄게요</div></div>`;
    } else {
      const n = toIndex(t.outSum, avg.total);
      const range = avg.isNow ? `지난 ${avg.months}달 ${avg.cutDay}일까지 평균` : `지난 ${avg.months}달 평균`;
      const say = n === null ? '지난달들엔 이 날짜까지 쓴 용돈이 없었어요'
        : n >= 110 ? `${range}보다 ${n - 100}% 더 썼어요`
        : n <= 90 ? `${range}보다 ${100 - n}% 덜 썼어요 👍`
        : `${range}과 비슷하게 쓰고 있어요`;
      idxCard = `
        <div class="idx-card">
          <div class="top"><span>👛 용돈 지수 <span class="memo">내 평균 = 100</span></span>${idxTag(t.outSum, avg.total)}</div>
          <div class="memo">${say} · 평균 ${won(Math.round(avg.total))}</div>
        </div>`;
    }
    const cats = Object.entries(t.byCat).sort((a, b) => b[1] - a[1]);
    const stats = idxCard + (cats.length
      ? cats.map(([c, v]) => `
          <div class="stat"><span>${catEmoji('out', c)} ${esc(c)}</span>
            <div class="bar"><i style="width:${Math.max(2, v / t.outSum * 100)}%"></i></div>
            <b>${won(v)} <span class="memo">${Math.round(v / t.outSum * 100)}%</span> ${idxTag(v, avg.byCat[c] || 0)}</b></div>`).join('')
      : `<div class="empty">이번 달 용돈 쓴 내역이 아직 없어요.</div>`);

    // 내역 (종류별 탭, 최근 날짜가 위로)
    const rows = DB.money.filter(x => x.date.slice(0, 7) === key && (money.view === 'all' || x.type === money.view))
      .map((x, i) => [x, i]).sort((a, b) => b[0].date.localeCompare(a[0].date) || b[1] - a[1]).map(p => p[0]);
    const SIGN = { in: ['+', 'plus'], fixed: ['-', 'fixed'], out: ['-', 'minus'] };
    let list = '', lastDate = '';
    rows.forEach(x => {
      if (x.date !== lastDate) {
        lastDate = x.date;
        const dayOut = rows.filter(r => r.date === x.date && r.type !== 'in').reduce((s, r) => s + r.amount, 0);
        list += `<div class="day-head"><span>${dateLabel(x.date)}</span><span>${dayOut ? '나간 돈 ' + won(dayOut) : ''}</span></div>`;
      }
      list += `
        <div class="mrow">
          <span class="em">${catEmoji(x.type, x.cat)}</span>
          <div class="body"><span>${esc(x.memo || x.cat)}</span>${x.memo ? `<span class="cat">${esc(x.cat)}</span>` : ''}</div>
          <span class="amt ${SIGN[x.type][1]}">${SIGN[x.type][0]}${won(x.amount)}</span>
          <span class="acts">
            <button class="icon-btn" type="button" title="고치기" onclick="startMoneyEdit('${x.id}')">✏️</button>
            <button class="icon-btn" type="button" title="지우기" onclick="removeMoney('${x.id}')">🗑️</button>
          </span>
        </div>`;
    });
    if (!list) list = money.view === 'all'
      ? `<div class="empty">이 달에 적은 내역이 없어요. 위에서 첫 기록을 적어 보세요 ✍️</div>`
      : `<div class="empty">이 달에 이 종류로 적은 내역은 없어요. '전체'를 눌러 모두 볼 수 있어요.</div>`;
    const viewTab = (v, label) => `<button class="tab ${money.view === v ? 'on' : ''}" type="button" onclick="setMoneyView('${v}')">${label}</button>`;

    const typePick = (v, label) => `<label class="pick"><input type="radio" name="mType" value="${v}" ${money.type === v ? 'checked' : ''} onchange="setMoneyType('${v}')"><span>${label}</span></label>`;

    document.getElementById('panel').innerHTML = `
      <button class="close" type="button" onclick="closePanel()">거실로 ←</button>
      <h2>📔 가계부 다이어리</h2>
      <div class="sub">들어온 돈 − 고정비 − 용돈 = 남은 돈 → 자유적금 💖</div>
      <div class="cal-head">
        <button class="btn" type="button" onclick="moveMoneyMonth(-1)" aria-label="이전 달">◀</button>
        <b>${money.y}년 ${money.m + 1}월</b>
        <button class="btn" type="button" onclick="moveMoneyMonth(1)" aria-label="다음 달">▶</button>
      </div>

      ${flow}
      ${money.copyOpen ? copyBox() : ''}
      ${hp}

      <form class="form money-form" onsubmit="submitMoney(event)" autocomplete="off">
        <div class="full seg">
          ${typePick('out', '👛 용돈 쓰기')}${typePick('fixed', '🏠 고정비')}${typePick('in', '💰 들어온 돈')}
          ${editing ? '<b class="memo" style="align-self:center">· 고치는 중</b>' : ''}
        </div>
        <input class="amount" type="text" name="mAmount" inputmode="numeric" placeholder="금액 (원)" oninput="formatAmount(this)"
          value="${editing ? editing.amount.toLocaleString('ko-KR') : ''}" aria-label="금액" required>
        <input type="date" name="mDate" value="${formDate}" aria-label="날짜" required>
        <div class="full chips" id="catPicks">${catPicks()}</div>
        <input class="full" type="text" name="mMemo" maxlength="100" placeholder="메모 (선택) · 예: 점심 김밥, 넷플릭스" value="${editing ? esc(editing.memo) : ''}">
        <div class="actions">
          ${editing ? `<button class="btn" type="button" onclick="cancelMoneyEdit()">취소</button>` : ''}
          <button class="btn primary" type="submit">${editing ? '고친 내용 저장' : '+ 적기'}</button>
        </div>
      </form>

      <div class="sec"><h3>📊 용돈 어디에 썼을까?</h3>${stats}</div>
      <div class="sec">
        <h3>🧾 내역</h3>
        <div class="tabs">${viewTab('all', '전체')}${viewTab('in', '💰 들어온 돈')}${viewTab('fixed', '🏠 고정비')}${viewTab('out', '👛 용돈')}</div>
        ${list}
      </div>`;
  }

  function submitMoney(e) {
    e.preventDefault();
    const f = e.target.elements;
    const amount = parseAmount(f.mAmount.value);
    if (!amount || amount > MAX_WON) { toast('금액을 숫자로 적어 주세요'); f.mAmount.focus(); return; }
    if (!DATE_RE.test(f.mDate.value)) { toast('날짜를 골라 주세요'); return; }
    const item = { date: f.mDate.value, type: money.type, amount, cat: money.cat, memo: f.mMemo.value.trim().slice(0, 100) };

    if (money.editId) {
      const x = DB.money.find(r => r.id === money.editId);
      if (x) Object.assign(x, item);
      money.editId = null;
      if (saveDB()) toast('고친 내용을 저장했어요');
    } else {
      DB.money.push({ id: newId(), ...item });
      gainXP(XP.money);
      const name = { in: '들어온 돈', fixed: '고정비', out: '용돈' }[item.type];
      if (saveDB()) toast(`${name} ${won(amount)} 적었어요 📔`);
    }
    // 다른 달 날짜로 적었으면 그 달로 넘어가서 보여 줘요
    const d = parseYmd(item.date);
    money.y = d.getFullYear(); money.m = d.getMonth();
    renderMoney();
    refreshLiving();
    document.querySelector('.money-form input[name=mAmount]').focus();
  }
  function startMoneyEdit(id) {
    const x = DB.money.find(r => r.id === id);
    if (!x) return;
    Object.assign(money, { editId: id, type: x.type, cat: x.cat });
    renderMoney();
    document.querySelector('.money-form input[name=mAmount]').focus();
  }
  function cancelMoneyEdit() { money.editId = null; renderMoney(); }
  async function removeMoney(id) {
    const x = DB.money.find(r => r.id === id);
    if (!x || !(await askConfirm(`${dateLabel(x.date)} ${x.memo || x.cat} ${won(x.amount)}을 지울까요?`))) return;
    DB.money = DB.money.filter(r => r.id !== id);
    gainXP(-XP.money);
    if (money.editId === id) money.editId = null;
    if (saveDB()) toast('내역을 지웠어요');
    renderMoney();
    refreshLiving();
  }

  // ---- 여행 (주황 문) ----
  // 첫 화면: 필수 체크리스트 → 새 여행 만들기 → 내 여행(최근이 위)
  // 여행 안: 날짜 카드 → 날짜 안: 그날 일정 + 사용 비용
  const TRIP_CATS = [['숙소', '🏨'], ['교통비', '🚌'], ['식비', '🍜'], ['기념품', '🎁'], ['기타', '📦']];
  const tripCatEmoji = c => (TRIP_CATS.find(x => x[0] === c) || [, '📦'])[1];
  const travel = { tripId: null, day: null, costCat: '식비', editId: null, editKind: '', editTrip: false };

  function tripDate(trip, i) { const d = parseYmd(trip.start); d.setDate(d.getDate() + i); return ymd(d); }
  const shortDate = s => `${+s.slice(5, 7)}/${+s.slice(8)} (${WEEK[parseYmd(s).getDay()]})`;
  const nightsLabel = n => n === 1 ? '당일치기' : `${n - 1}박 ${n}일`;
  const sumCost = list => list.reduce((s, c) => s + c.amount, 0);
  const tripCost = trip => sumCost(trip.costs);
  function tripStatus(trip) {
    const today = ymd(new Date());
    if (today < trip.start) return { text: ddayLabel(trip.start), cls: 'soon' };
    if (today <= trip.end) return { text: `여행 중 ✈️ ${Math.round((parseYmd(today) - parseYmd(trip.start)) / 86400000) + 1}일차`, cls: 'now' };
    return { text: '다녀왔어요', cls: 'past' };
  }
  const currentTrip = () => DB.trips.find(t => t.id === travel.tripId);
  // 최근 여행(가는 날이 늦은 여행)이 맨 위
  const sortedTrips = () => DB.trips.slice().sort((a, b) => b.start.localeCompare(a.start));
  function catBars(costs) {
    const total = sumCost(costs);
    const byCat = {};
    costs.forEach(c => { byCat[c.cat] = (byCat[c.cat] || 0) + c.amount; });
    return Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => `
      <div class="stat"><span>${tripCatEmoji(c)} ${esc(c)}</span>
        <div class="bar"><i style="width:${Math.max(2, v / total * 100)}%"></i></div>
        <b>${won(v)} <span class="memo">${Math.round(v / total * 100)}%</span></b></div>`).join('');
  }

  function openTravel() {
    if (!currentTrip()) Object.assign(travel, { tripId: null, day: null });
    Object.assign(travel, { editTrip: false, editId: null });
    renderTravel();
    document.getElementById('panelBg').classList.add('open');
  }
  function goTravel(tripId, day) {
    Object.assign(travel, { tripId, day, editId: null, editKind: '', editTrip: false });
    renderTravel();
    document.getElementById('panel').scrollTop = 0;
  }
  const openTrip = id => goTravel(id, null);
  const openTripDay = d => goTravel(travel.tripId, d);
  const backToTrips = () => goTravel(null, null);
  const backToTrip = () => goTravel(travel.tripId, null);
  function toggleTripEdit() { travel.editTrip = !travel.editTrip; renderTravel(); }
  function renderTravel() {
    const trip = currentTrip();
    if (!trip) renderTripList();
    else if (travel.day === null || travel.day >= tripDays(trip)) { travel.day = null; renderTrip(trip); }
    else renderTripDay(trip, travel.day);
  }

  // 🎒 필수 체크리스트 (모든 여행에 같이 써요)
  function packBox() {
    const list = DB.packList, done = list.filter(p => p.done).length;
    return `
      <div class="pack-box">
        <div class="pack-head">
          <b>🎒 필수 체크리스트</b>
          <span class="memo">${list.length ? (done === list.length ? '다 챙겼어요! 🎉' : `${list.length}개 중 ${done}개 챙김`) : ''}</span>
          ${done ? `<button class="btn mini" type="button" onclick="resetPacks()">체크 모두 풀기</button>` : ''}
        </div>
        ${list.length ? `<div class="bar"><i style="width:${Math.round(done / list.length * 100)}%"></i></div>` : ''}
        <div class="pack-grid">
          ${list.map(p => `
            <div class="pack-item ${p.done ? 'done' : ''}">
              <label><input type="checkbox" ${p.done ? 'checked' : ''} onchange="togglePack('${p.id}')"><span>${esc(p.text)}</span></label>
              <button class="x-btn" type="button" title="빼기" onclick="removePack('${p.id}')">×</button>
            </div>`).join('')}
        </div>
        <form class="form pack-form" onsubmit="submitPack(event)" autocomplete="off">
          <input type="text" name="pkText" maxlength="30" placeholder="더 챙길 것 (예: 선크림)" required>
          <button class="btn" type="submit">+ 추가</button>
        </form>
      </div>`;
  }
  function submitPack(e) {
    e.preventDefault();
    const text = e.target.elements.pkText.value.trim().slice(0, 30);
    if (!text) return;
    if (DB.packList.some(p => p.text === text)) { toast('이미 있는 항목이에요'); return; }
    DB.packList.push({ id: newId(), text, done: false });
    saveDB();
    renderTravel();
    document.querySelector('.pack-form input[name=pkText]').focus();
  }
  function togglePack(id) {
    const p = DB.packList.find(x => x.id === id);
    if (!p) return;
    p.done = !p.done;
    saveDB();
    if (p.done && DB.packList.every(x => x.done)) toast('필수품 다 챙겼어요! 🎉');
    renderTravel();
  }
  async function removePack(id) {
    const p = DB.packList.find(x => x.id === id);
    if (!p || !(await askConfirm(`'${p.text}'을(를) 체크리스트에서 뺄까요?`, '빼기'))) return;
    DB.packList = DB.packList.filter(x => x.id !== id);
    saveDB();
    renderTravel();
  }
  async function resetPacks() {
    if (!(await askConfirm('체크를 모두 풀까요?\n새 여행을 준비할 때 처음부터 다시 챙길 수 있어요.', '모두 풀기'))) return;
    DB.packList.forEach(p => { p.done = false; });
    if (saveDB()) toast('체크를 모두 풀었어요');
    renderTravel();
  }

  // 여행 만들기 · 고치기에 같이 쓰는 칸
  function tripForm(trip) {
    return `
      <form class="form trip-form" onsubmit="${trip ? 'submitTripEdit' : 'submitTrip'}(event)" autocomplete="off">
        <label class="date-field full"><span>여행 제목</span>
          <input type="text" name="trName" maxlength="40" placeholder="예: 🍊 제주 여행" value="${trip ? esc(trip.name) : ''}" required></label>
        <label class="date-field"><span>가는 날</span>
          <input type="date" name="trStart" value="${trip ? trip.start : ''}" required
            onchange="if (!this.form.trEnd.value || this.form.trEnd.value < this.value) this.form.trEnd.value = this.value"></label>
        <label class="date-field"><span>오는 날</span><input type="date" name="trEnd" value="${trip ? trip.end : ''}" required></label>
        <div class="actions">
          ${trip ? `<button class="btn" type="button" onclick="toggleTripEdit()">취소</button>` : ''}
          <button class="btn primary" type="submit">${trip ? '고친 내용 저장' : '+ 여행 만들기'}</button>
        </div>
      </form>`;
  }
  function readTripForm(f) {
    const name = f.trName.value.trim(), start = f.trStart.value, end = f.trEnd.value;
    if (!name) { toast('여행 제목을 적어 주세요'); return null; }
    if (!DATE_RE.test(start) || !DATE_RE.test(end)) { toast('가는 날과 오는 날을 골라 주세요'); return null; }
    if (end < start) { toast('오는 날이 가는 날보다 빨라요'); return null; }
    if (tripDays({ start, end }) > 60) { toast('여행은 60일까지 적을 수 있어요'); return null; }
    return { name: name.slice(0, 40), start, end };
  }
  function submitTrip(e) {
    e.preventDefault();
    const v = readTripForm(e.target.elements);
    if (!v) return;
    const trip = { id: newId(), ...v, plans: [], packs: [], costs: [] };
    DB.trips.push(trip);
    gainXP(XP.trip);
    if (saveDB()) toast(`'${v.name}' 여행을 만들었어요 ✈️`);
    openTrip(trip.id);
    refreshLiving();
  }
  function submitTripEdit(e) {
    e.preventDefault();
    const trip = currentTrip(), v = readTripForm(e.target.elements);
    if (!trip || !v) return;
    Object.assign(trip, v);
    // 여행이 짧아졌으면 넘치는 날의 일정 · 비용은 마지막 날로 옮겨요
    const last = tripDays(trip) - 1;
    trip.plans.forEach(p => { if (p.day > last) p.day = last; });
    trip.costs.forEach(c => { if (c.day > last) c.day = last; });
    travel.editTrip = false;
    if (saveDB()) toast('여행 정보를 고쳤어요');
    renderTravel();
    refreshLiving();
  }
  async function removeTrip() {
    const trip = currentTrip();
    if (!trip || !(await askConfirm(`'${trip.name}' 여행을 지울까요?\n날짜별 일정 · 사용 비용도 모두 지워져요.`, '지우기'))) return;
    DB.trips = DB.trips.filter(t => t.id !== trip.id);
    gainXP(-(XP.trip + trip.plans.length * XP.plan + trip.costs.length * XP.cost));
    if (saveDB()) toast('여행을 지웠어요');
    backToTrips();
    refreshLiving();
  }

  // 첫 화면
  function renderTripList() {
    const cards = sortedTrips().map(t => {
      const s = tripStatus(t);
      return `
        <button class="trip-card ${s.cls}" type="button" onclick="openTrip('${t.id}')">
          <div class="tc-top"><b>${esc(t.name)}</b><span class="dday ${s.cls}">${s.text}</span></div>
          <div class="memo">${shortDate(t.start)} ~ ${shortDate(t.end)} · ${nightsLabel(tripDays(t))}</div>
          <div class="tc-meta"><span>🗺️ 일정 ${t.plans.length}개</span><span>💸 ${won(tripCost(t))}</span></div>
        </button>`;
    }).join('');
    document.getElementById('panel').innerHTML = `
      <button class="close" type="button" onclick="closePanel()">거실로 ←</button>
      <h2>✈️ 여행</h2>
      <div class="sub">필수품 챙기고, 여행을 만들고, 날짜별 일정 · 사용 비용을 적어요</div>
      ${packBox()}
      <div class="sec"><h3>✈️ 새 여행 만들기</h3>${tripForm(null)}</div>
      <div class="sec"><h3>📚 내 여행 ${DB.trips.length}개 <span class="memo">최근 여행이 위에 있어요</span></h3>
        ${cards || '<div class="empty">아직 여행이 없어요. 위에서 첫 여행을 만들어 보세요 🧳</div>'}</div>`;
  }

  // 여행 안: 날짜 카드
  function renderTrip(trip) {
    const s = tripStatus(trip), total = tripCost(trip);
    let days = '';
    for (let i = 0; i < tripDays(trip); i++) {
      const plans = trip.plans.filter(p => p.day === i).sort(byTime);
      const cost = sumCost(trip.costs.filter(c => c.day === i));
      days += `
        <button class="day-card" type="button" onclick="openTripDay(${i})">
          <div class="dc-top"><b>${i + 1}일차 일정</b><span class="memo">${shortDate(tripDate(trip, i))}</span><span class="dc-go">열기 ›</span></div>
